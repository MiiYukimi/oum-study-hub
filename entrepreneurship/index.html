<script id="questionData" type="application/json">{"1":{"title":"創業精神導論","en":"Introduction to Entrepreneurship","questions":[{"id":"t1q1","q":"Which French word is the origin of “entrepreneur”?","o":["Entourage","Entreprendre","Entrepriseur","Entrepreneurial"],"a":1,"x":"Entrepreneur 源自法文 entreprendre，意思接近「著手進行／承擔（to undertake）」。","kind":"Knowledge"},{"id":"t1q2","q":"In the earliest period, Marco Polo was used as an example of a person who mainly _____.","o":["worked as a bank officer","provided all the capital but never travelled","traded goods using funds provided by a capitalist","managed a government building project"],"a":2,"x":"課本用 Marco Polo 說明早期的交易中間人：資本家（Capitalist）出資，商人負責實際貿易。","kind":"Knowledge"},{"id":"t1q3","q":"During the Middle Ages, an entrepreneur was usually seen as a person who _____.","o":["controlled the national currency","sold company shares to the public","managed large projects using government resources","invented all production technologies"],"a":2,"x":"中世紀 Entrepreneur 常負責大型工程（Large projects），但資源可能來自政府。","kind":"Knowledge"},{"id":"t1q4","q":"Which scholar linked the entrepreneur to risk-taking in the 17th century?","o":["Eli Whitney","Ray Kroc","Richard Cantillon","Thomas Edison"],"a":2,"x":"Richard Cantillon 將創業者與風險承擔（Risk-taking）連結。","kind":"Knowledge"},{"id":"t1q5","q":"A trader buys products at a known price but sells them later at an unknown price. This best shows _____.","o":["no business responsibility","risk and uncertainty","a fixed salary","a guaranteed profit"],"a":1,"x":"買入價已知、賣出價未知，代表商業不確定性（Uncertainty），盈利或虧損由商人承擔。","kind":"Application"},{"id":"t1q6","q":"What became clearer in the 18th-century view of entrepreneurship?","o":["The difference between an entrepreneur and a capital provider","The idea that managers own every company","The rule that entrepreneurs cannot borrow money","The rule that innovation must be patented"],"a":0,"x":"工業化後，Entrepreneur 可以使用資本，但提供資金的人（Capital provider）可以是另一個角色。","kind":"Knowledge"},{"id":"t1q7","q":"By the mid-20th century, entrepreneurs were increasingly viewed as _____.","o":["political leaders","tax collectors","employees only","innovators"],"a":3,"x":"20 世紀中期強調創新者（Innovator）：使用發明或新方法創造產品／改變生產。","kind":"Knowledge"},{"id":"t1q8","q":"Which statement best describes modern entrepreneurship?","o":["It involves opportunity, innovation, resources and risk","It requires the owner to invent all products","It guarantees financial independence immediately","It only means registering a shop"],"a":0,"x":"現代 Entrepreneurship 連結機會（Opportunity）、創新（Innovation）、資源與風險承擔。","kind":"Knowledge"},{"id":"t1q9","q":"According to the textbook's entrepreneurship concept, which is NOT a required element?","o":["Guaranteed success","Taking certain risks","Creating value","Devoting time and effort"],"a":0,"x":"創業會投入努力、創造價值、承擔風險，但不保證成功（Guaranteed success）。","kind":"Knowledge"},{"id":"t1q10","q":"Which is an example of a psychological risk in entrepreneurship?","o":["Feeling stress about possible failure","Paying a supplier invoice","Transporting goods to a shop","Buying office furniture"],"a":0,"x":"心理風險（Psychological risk）包括壓力、對失敗的焦慮等，而不只是財務損失。","kind":"Knowledge"},{"id":"t1q11","q":"An entrepreneur combines people, money and skills to turn an idea into a real service. Which concept is most obvious?","o":["Consumption","Avoidance","Organising","Inheritance"],"a":2,"x":"整合人力、資金與技能屬於組織（Organising）資源，為 Entrepreneur 常見的核心概念。","kind":"Application"},{"id":"t1q12","q":"Which combination correctly lists the four dimensions mentioned by Kuratko and Hodgetts?","o":["Individual, organisational, environmental, process","Government, bank, supplier, customer","Product, price, place, promotion","Income, debt, savings, investment"],"a":0,"x":"四個維度（Dimensions）是 Individuals、Organisational、Environmental、Process。","kind":"Knowledge"},{"id":"t1q13","q":"A person notices an unmet customer need and develops a marketable solution. Which entrepreneurial action is shown?","o":["Following every competitor without change","Avoiding market changes","Recognising and seizing an opportunity","Stopping innovation"],"a":2,"x":"辨認及掌握機會（Recognise and seize opportunities）是 Entrepreneur 的重要特徵。","kind":"Application"},{"id":"t1q14","q":"Which five ideas commonly appear across definitions of entrepreneurs?","o":["Advertising, packaging, colour, size, logo","Tax, debt, inflation, exchange, interest","Newness, wealth, organising, creating, risk-taking","Salary, vacation, attendance, uniform, rank"],"a":2,"x":"課本概括五項：Newness、Wealth、Organising、Creating、Risk-taking。","kind":"Knowledge"},{"id":"t1q15","q":"From an economist's perspective, an entrepreneur mainly _____.","o":["recombines resources to create greater value","focuses only on personal hobbies","avoids all business competition","works only for a fixed salary"],"a":0,"x":"經濟學角度重視把 resources、labour、assets 重新組合並增加價值。","kind":"Knowledge"},{"id":"t1q16","q":"Which is a wider economic contribution of entrepreneurship?","o":["Reducing every company's taxes to zero","Creating jobs through new ventures","Ending the need for suppliers","Removing all consumer choices"],"a":1,"x":"新事業（New ventures）能創造工作機會（Job creation），是創業的重要經濟貢獻。","kind":"Knowledge"},{"id":"t1q17","q":"Why is entrepreneurship described as a catalyst for economic change?","o":["It prevents customers from trying new products","It helps create innovation, investment and new firms","It keeps all business methods unchanged","It removes the need for research"],"a":1,"x":"催化劑（Catalyst）指創業可推動 Innovation、Investment 和 New ventures 等變化。","kind":"Knowledge"},{"id":"t1q18","q":"A startup improves a service so that customers spend less time waiting. Which benefit is most direct?","o":["Guaranteed international success","No need for employees","Automatic removal of competition","Improved satisfaction of human needs"],"a":3,"x":"更好的服務滿足人類需要（Human needs），也可改善生活品質。","kind":"Application"},{"id":"t1q19","q":"Why may innovation attract investment?","o":["It makes all investments risk-free","It always increases government subsidies","It replaces every financial institution","It can create new products, services and market opportunities"],"a":3,"x":"新產品、服務與機會可能吸引投資，但仍有風險。","kind":"Knowledge"},{"id":"t1q20","q":"Which is an example of wealth creation and distribution?","o":["A firm closes every branch to avoid customers","A firm buys goods but never sells them","A firm refuses to pay all salaries","A firm creates value and later supports a community programme"],"a":3,"x":"創業可能創造財富（Wealth creation），部分成果亦可透過社會活動回饋。","kind":"Knowledge"},{"id":"t1q21","q":"“Entrepreneurs are doers, not thinkers” is a myth because entrepreneurs _____.","o":["never use alternative plans","both plan and take action","must avoid planning","only discuss ideas"],"a":1,"x":"Entrepreneur 既是行動者，也是思考與規劃者（Thinkers and doers）。","kind":"Knowledge"},{"id":"t1q22","q":"Which statement best challenges “entrepreneurs are born, not made”?","o":["Entrepreneurship can be learned and developed","Only one personality type can start a firm","Education makes entrepreneurship impossible","Entrepreneurs never improve their skills"],"a":0,"x":"Entrepreneurship 可以學習，並有 Models、Processes 和 Case studies。","kind":"Knowledge"},{"id":"t1q23","q":"Ray Kroc and McDonald's are used to show that entrepreneurs _____.","o":["can succeed without being the original inventor","always invent the original product","must operate only one small outlet","never innovate a business model"],"a":0,"x":"Ray Kroc 的例子反駁「Entrepreneur 一定是 Inventor」的迷思。","kind":"Knowledge"},{"id":"t1q24","q":"Why is “all entrepreneurs need is money” misleading?","o":["Capital is useful but not enough by itself","Good ideas need no resources","Money has no possible business use","Banks never finance entrepreneurs"],"a":0,"x":"資金（Capital）是一項重要 Resource，但還需要機會、規劃、執行等。","kind":"Knowledge"},{"id":"t1q25","q":"What is the textbook's view of luck in entrepreneurship?","o":["Luck alone explains business success","Planning reduces all success","Innovativeness is unnecessary","Preparation and knowledge help entrepreneurs use opportunities"],"a":3,"x":"運氣不是唯一要素，Preparation、Knowledge、Determination 和 Innovation 也重要。","kind":"Knowledge"},{"id":"t1q26","q":"What type of risk do entrepreneurs generally prefer?","o":["Moderate and calculated risks","No risk under any condition","Extreme gambling risks","Unnecessary risks"],"a":0,"x":"課本強調適度且經計算的風險（Moderate and calculated risks）。","kind":"Knowledge"},{"id":"t1q27","q":"An entrepreneur treats an early failed venture as a lesson for the next one. This challenges the myth that _____.","o":["entrepreneurs always need patents","entrepreneurs only need luck","entrepreneurs have no customers","entrepreneurs cannot learn from failure"],"a":3,"x":"失敗（Failure）可成為學習經驗，幫助改善之後的決策。","kind":"Application"},{"id":"t1q28","q":"Before independence, the textbook associates Chinese communities mainly with _____.","o":["public administration only","rubber estates only","mining and business","fishing only"],"a":2,"x":"課本描述殖民時期的社會經濟分工：華人主要集中於 Mining and business。","kind":"Knowledge"},{"id":"t1q29","q":"Which Malaysian policy is listed as supporting entrepreneurship development from 1971 to 1990?","o":["National Sports Policy","Vision 2050","New Economic Policy (NEP)","Digital-only Tax Rule"],"a":2,"x":"新經濟政策（New Economic Policy, NEP）是教材列出的重要政策。","kind":"Knowledge"},{"id":"t1q30","q":"What is the main message of the Malaysian entrepreneurship-development section?","o":["Entrepreneurship developed without history or government","Business activity began only after the internet","Only foreign firms can be entrepreneurs","History and government policies shaped entrepreneurship development"],"a":3,"x":"教材把馬來西亞創業發展放在歷史、政策與政府機構支持的脈絡中。","kind":"Knowledge"}]},"2":{"title":"成功企業家的特徵","en":"Identifying Entrepreneurial Characteristics","questions":[{"id":"t2q1","q":"An entrepreneur steps in to solve a problem when no one is leading. Which characteristic is shown?","o":["Avoidance of Leadership","Initiative and Responsibility","Indifference to Results","Dependence on Instructions"],"a":1,"x":"主動與責任感（Initiative and Responsibility）是願意主動處理問題並對結果負責。","kind":"Application"},{"id":"t2q2","q":"Continuing to work on a venture despite early difficulties best shows _____.","o":["Fear of Opportunity","Lack of Vision","Weak Motivation","High Degree of Commitment"],"a":3,"x":"高度投入（High Degree of Commitment）有助 Entrepreneur 面對障礙和錯誤。","kind":"Knowledge"},{"id":"t2q3","q":"Which statement best shows Opportunity Orientation?","o":["Wait for competitors to decide everything","Buy machines before knowing customer demand","Start with what customers need and find resources later","Avoid unexplored needs"],"a":2,"x":"機會導向（Opportunity Orientation）重視先發現機會，再安排 Resources 和 Strategy。","kind":"Knowledge"},{"id":"t2q4","q":"An entrepreneur tests a product before investing heavily. This is an example of _____.","o":["Ignoring Feedback","Extreme Risk-taking","No Commitment","Moderate Risk-taking"],"a":3,"x":"適度風險承擔（Moderate Risk-taker）會仔細思考而非盲目投入。","kind":"Application"},{"id":"t2q5","q":"Which pair best describes a successful entrepreneur's mindset?","o":["Pessimism and no planning","Arrogance and denial","Certainty and no risk","Confidence and realistic optimism"],"a":3,"x":"自信和樂觀（Confident and Optimistic）應建立於現實基礎，而非假裝零風險。","kind":"Knowledge"},{"id":"t2q6","q":"Creating a unique service to stand out from competitors shows _____.","o":["Obedience only","Creativity and Innovation","Fixed Routine","Financial Reporting"],"a":1,"x":"創意與創新（Creative and Innovative）可創造差異化與競爭優勢。","kind":"Knowledge"},{"id":"t2q7","q":"Why do entrepreneurs actively seek customer feedback?","o":["To improve performance and learn from mistakes","To replace all market research","To guarantee praise","To avoid changing their business"],"a":0,"x":"尋求回饋（Seeking Feedback）幫助從錯誤學習，改善 venture performance。","kind":"Knowledge"},{"id":"t2q8","q":"A founder is driven by the challenge of achieving a difficult target. This shows _____.","o":["Desire to Avoid Work","Drive to Achieve","Lack of Goals","Dependence on Luck"],"a":1,"x":"成就動機（Drive to Achieve）指內在追求成果與挑戰；Money 並非唯一動機。","kind":"Application"},{"id":"t2q9","q":"Which characteristic means knowing what the firm may become in the future?","o":["Moderate Risk-taking","Seeking Feedback","Physical Strength","Ability to Set Vision"],"a":3,"x":"設定願景（Ability to Set Vision）是能想像企業未來方向，即使 Vision 可能逐步形成。","kind":"Knowledge"},{"id":"t2q10","q":"A founder assigns work to people with suitable skills. This shows _____.","o":["Social Withdrawal","Skilled at Organising","No Planning","Extreme Independence"],"a":1,"x":"組織能力（Skilled at Organising）能把合適的人與 Resources 組合。","kind":"Application"},{"id":"t2q11","q":"What does Internal Locus of Control mean?","o":["Believing competitors control every decision","Ignoring personal responsibility","Believing outcomes depend entirely on luck","Believing one's actions can influence outcomes"],"a":3,"x":"內控信念（Internal Locus of Control）相信自己對成功與失敗有影響力。","kind":"Knowledge"},{"id":"t2q12","q":"A founder examines a failed campaign and changes the plan. This shows _____.","o":["Tolerance of Failure","Unrealistic Confidence","Failure Avoidance","No Feedback"],"a":0,"x":"容忍失敗（Tolerance of Failure）是把失敗當 learning experience。","kind":"Application"},{"id":"t2q13","q":"Why does the textbook mention High Level of Energy?","o":["Entrepreneurs must play competitive sports","Entrepreneurs avoid responsibility","Entrepreneurs may face demanding workloads and stress","Entrepreneurs never rest"],"a":2,"x":"創業需要持續處理 workload 和 stress，所以課本把高能量列為常見特徵。","kind":"Knowledge"},{"id":"t2q14","q":"Which is the best example of Team Building?","o":["Forming a skilled and motivated team","Doing every job personally","Avoiding all employees","Refusing help from experts"],"a":0,"x":"團隊建立（Team Building）有助 venture 成長，並不等於所有事都由 founder 做。","kind":"Knowledge"},{"id":"t2q15","q":"An independent entrepreneur generally wants _____.","o":["no contact with customers","every decision made by suppliers","no responsibility for the firm","authority over important decisions"],"a":3,"x":"獨立性（Independent）重視重要決策的自主權，但不代表獨自完成一切。","kind":"Application"},{"id":"t2q16","q":"A business changes its product after customer preferences shift. This shows _____.","o":["Risk Avoidance","Flexibility","Rigidity","Lack of Responsibility"],"a":1,"x":"彈性（Flexibility）可讓 business 適應 changing customer demands。","kind":"Application"},{"id":"t2q17","q":"Which pair includes two of the 16 characteristics?","o":["Obedience and Guaranteed Profit","Tax Avoidance and Monopoly","Seeking Feedback and Flexibility","Advertising and Import Duty"],"a":2,"x":"Seeking Feedback 與 Flexibility 都是課本列出的成功 Entrepreneur 特徵。","kind":"Knowledge"},{"id":"t2q18","q":"Why is high commitment valuable in a startup?","o":["It removes the need for capital","It helps deal with business-threatening obstacles","It guarantees zero mistakes","It prevents all competitors"],"a":1,"x":"High Degree of Commitment 可協助克服錯誤和障礙，但不保證成功。","kind":"Knowledge"},{"id":"t2q19","q":"Which characteristic is MOST directly linked to competitive advantage through new ideas?","o":["Following old methods exactly","Avoiding customer change","High salary expectation","Creative and Innovative"],"a":3,"x":"Creative and Innovative 幫助 Entrepreneur 提供有差異化的產品與服務。","kind":"Knowledge"},{"id":"t2q20","q":"Which characteristic helps entrepreneurs improve using information from others?","o":["Extreme Risk-taking","Seeking Feedback","Fear of Failure","Refusal to Listen"],"a":1,"x":"Entrepreneur 會主動收集並運用 Feedback。","kind":"Knowledge"},{"id":"t2q21","q":"The entrepreneur self-assessment test is mainly used to _____.","o":["guarantee a bank loan","decide a person's genetic ability","replace all entrepreneurship education","judge entrepreneurial inclination potential"],"a":3,"x":"自我評估（Self-assessment）只用來了解創業傾向（Inclination potential），不是判定命運。","kind":"Application"},{"id":"t2q22","q":"Which statement agrees with Topic 2?","o":["Only wealthy people can be entrepreneurs","Entrepreneurship cannot be improved","Entrepreneurship is purely inherited","Entrepreneurship is a learned skill"],"a":3,"x":"課本指出 Entrepreneurship 不是 Genetic trait，可以學習和培養。","kind":"Knowledge"},{"id":"t2q23","q":"Who can potentially become an entrepreneur according to the textbook?","o":["Only men above age 40","People of many backgrounds and ages","Only graduates in finance","Only people who inherit a business"],"a":1,"x":"教材認為任何背景的人都可能發展 Entrepreneurial potential。","kind":"Knowledge"},{"id":"t2q24","q":"A small businessman is described as mainly operating to _____.","o":["invent every product","support a living and family through profit","avoid every customer","build a large global company immediately"],"a":1,"x":"Small Businessman 常以生活與家庭收入為主要目標；這是課本的比較性描述。","kind":"Application"},{"id":"t2q25","q":"Which risk preference is more associated with an entrepreneur than a small businessman in the textbook?","o":["Fixed-salary security only","Calculated moderate risk","No opportunity seeking","Risk-free guaranteed investment"],"a":1,"x":"教材比較 Entrepreneur 的 Moderate / calculated risk 和 Small Businessman 的 Low risk-taking。","kind":"Knowledge"},{"id":"t2q26","q":"A small businessman is more likely to _____.","o":["enter a tested and proven market","reject all known products","avoid earning a profit","pursue an untested invention in every case"],"a":0,"x":"Small Businessman 在課本比較表中較傾向已證實的市場（Proven market）。","kind":"Application"},{"id":"t2q27","q":"Compared with a conventional manager, an entrepreneur is often more likely to _____.","o":["make no decisions","view rules as guidelines","refuse all responsibility","never act on ideas"],"a":1,"x":"課本比較表：Conventional Manager 重視 Rules，而 Entrepreneur 較視 Rules 為 Guidelines。","kind":"Knowledge"},{"id":"t2q28","q":"Which is more typical of a conventional manager in the textbook's comparison?","o":["Always refusing formal procedures","Making detailed plans and identifying possible problems","Ignoring organisational guidelines","Avoiding all planning"],"a":1,"x":"傳統經理（Conventional Manager）較常作詳細計畫並預先辨認問題。","kind":"Knowledge"},{"id":"t2q29","q":"Which statement is MOST accurate about the two roles?","o":["An entrepreneur and a manager may have different priorities","Every entrepreneur must dislike planning","Business managers never make decisions","Every manager is automatically an entrepreneur"],"a":0,"x":"課本用不同傾向比較兩種角色，不代表真實世界的人必定完全符合。","kind":"Knowledge"},{"id":"t2q30","q":"A founder encourages staff, delegates tasks and adapts to changing demand. Which combination is shown?","o":["Only Financial Accounting","Only Tax Planning","Team Building, Skilled at Organising, Flexibility","Only Risk Avoidance"],"a":2,"x":"團隊建立、資源組織與彈性是可以同時出現的 Entrepreneur characteristics。","kind":"Application"}]},"3":{"title":"企業家創意與創新","en":"Developing Entrepreneurial Creativity and Innovation","questions":[{"id":"t3q1","q":"According to the textbook, creativity is best described as the ability to produce ideas that are _____.","o":["expensive but not useful","novel, high-quality and appropriate","copied exactly from competitors","familiar and unchanged"],"a":1,"x":"創意（Creativity）需要新穎（Novel）、高品質（High quality）及合適／有用（Appropriate）。","kind":"Knowledge"},{"id":"t3q2","q":"What is the FIRST phase of the Creative Process?","o":["Knowledge Accumulation","Incubation","Evaluation","Implementation"],"a":0,"x":"四階段第一步是知識累積（Knowledge Accumulation）。","kind":"Knowledge"},{"id":"t3q3","q":"An entrepreneur reads studies and interviews customers before designing a product. Which phase is shown?","o":["Incubation","Idea Flash","Knowledge Accumulation","Commercial Launch"],"a":2,"x":"先蒐集資訊、訪談與學習是 Knowledge Accumulation。","kind":"Application"},{"id":"t3q4","q":"Taking a break while the mind continues working on a problem is _____.","o":["Franchising","Budgeting","Incubation","Marketing"],"a":2,"x":"孵化期（Incubation）是暫時放下明顯的思考，讓想法繼續醞釀。","kind":"Knowledge"},{"id":"t3q5","q":"An unexpected solution suddenly comes to mind after reflection. This best represents _____.","o":["Cost Control","Ideas phase","Government Regulation","Opportunity Evaluation only"],"a":1,"x":"Ideas 階段出現解題想法，通常建立在先前資訊和孵化之上。","kind":"Knowledge"},{"id":"t3q6","q":"Which is the final phase in the textbook's Creative Process?","o":["Incubation","Evaluation and Implementation","Knowledge Accumulation","Idea Generation only"],"a":1,"x":"最後需要評估與實行（Evaluation and Implementation），不只是想到 idea。","kind":"Knowledge"},{"id":"t3q7","q":"Which is a barrier to creativity?","o":["Enough Time for Ideas","Supportive Culture","Open-minded Discussion","Fear of Criticism"],"a":3,"x":"害怕批評（Fear of Criticism）可能讓人不敢分享新 idea。","kind":"Knowledge"},{"id":"t3q8","q":"An organisation has so many strict rules that employees avoid suggesting new methods. This is _____.","o":["Open Innovation","Market Expansion","Free Brainstorming","Over-management"],"a":3,"x":"過度管理（Over-management）是課本列出的 Creativity barrier。","kind":"Knowledge"},{"id":"t3q9","q":"Which of the following is NOT one of the five creative idea techniques?","o":["Forced Analogy","Brainstorming","Mind Mapping","Cash Flow Auditing"],"a":3,"x":"課本五種方法：Brainstorming、Forced Analogy、DO IT、Mind Mapping、Nominal Group。","kind":"Knowledge"},{"id":"t3q10","q":"What is a basic rule of brainstorming?","o":["Only the manager may speak","Accept one idea and stop","Encourage many ideas before judging them","Criticise each idea immediately"],"a":2,"x":"腦力激盪（Brainstorming）先大量產生 ideas，不立即批評。","kind":"Knowledge"},{"id":"t3q11","q":"What is the suggested group size for brainstorming in the module?","o":["1–2 people","4–7 people","Over 100 people","15–20 people"],"a":1,"x":"教材建議 Brainstorming group 約 4–7 人。","kind":"Knowledge"},{"id":"t3q12","q":"Which creative technique links unrelated things to produce new ideas?","o":["Business Forecasting","Forced Analogy","Balance Sheet","Outsourcing"],"a":1,"x":"強迫類比（Forced Analogy）把無關概念建立連結以刺激新想法。","kind":"Knowledge"},{"id":"t3q13","q":"In DO IT, the letter D stands for _____.","o":["Delay Testing","Develop Debt","Deliver Product","Define Problem"],"a":3,"x":"DO IT：D=Define problem、O=Open mind、I=Identify best solution、T=Transform。","kind":"Knowledge"},{"id":"t3q14","q":"Which technique uses a visual, non-linear arrangement of connected ideas?","o":["Bank Reconciliation","Costing","Balance Sheet","Mind Mapping"],"a":3,"x":"心智圖（Mind Mapping）以非線性的圖像與關聯整理 ideas。","kind":"Knowledge"},{"id":"t3q15","q":"What makes Nominal Group different from free brainstorming?","o":["Only one participant gives all answers","Individuals first write ideas and later rank them","No idea is ever evaluated","It is always done without a group"],"a":1,"x":"Nominal Group 常先獨立寫 ideas，再討論並排序或投票。","kind":"Knowledge"},{"id":"t3q16","q":"Which quality best describes a creative individual?","o":["Never evaluates ideas","Refuses all new experiences","Cannot accept feedback","Open to criticism and willing to try new things"],"a":3,"x":"創意個體（Creative Individuals）通常思想開放、願意嘗試與接受批評。","kind":"Knowledge"},{"id":"t3q17","q":"How does innovation differ from creativity?","o":["The two concepts have no relationship","Creativity always needs factory machines","Innovation means ideas never reach the market","Innovation applies ideas to create new or better value"],"a":3,"x":"Creativity 偏向產生想法；Innovation 是把新 idea 應用成有價值的產品、服務或方法。","kind":"Knowledge"},{"id":"t3q18","q":"Which type of innovation creates a totally novel product or process?","o":["Invention","Routine Maintenance","Duplication","Extension"],"a":0,"x":"發明（Invention）指創造全新、未曾嘗試過的 product / service / process。","kind":"Knowledge"},{"id":"t3q19","q":"A company adds a new service to its existing product line. What type of innovation is this?","o":["Synthesis","Extension","Duplication","Invention"],"a":1,"x":"延伸（Extension）是既有產品線、服務或流程的擴充。","kind":"Application"},{"id":"t3q20","q":"A company improves an existing product with extra features rather than copying it exactly. This is closest to _____.","o":["Duplication","Invention","No innovation","Political Change"],"a":0,"x":"課本 Duplication 不只 copy，還能加入功能或改善。","kind":"Application"},{"id":"t3q21","q":"A business combines two existing technologies into a new application. This is _____.","o":["Synthesis","Pure Invention only","Extension","Franchising"],"a":0,"x":"綜合（Synthesis）把已存在的不同元素整合成新應用。","kind":"Application"},{"id":"t3q22","q":"Which example best fits Synthesis?","o":["Paying salaries on time","Repeating a routine without changes","Combining computer and network technologies","Repainting an office wall"],"a":2,"x":"課本以 Computer + Network technologies 產生新的 Internet 應用作 Synthesis 例子。","kind":"Knowledge"},{"id":"t3q23","q":"An unexpected product failure reveals a new customer need. What source of innovation is this?","o":["Fixed Salary","Office Uniform","Unexpected Events","Tax Filing"],"a":2,"x":"意外事件（Unexpected events）包含 Unexpected success/failure，可揭示新機會。","kind":"Application"},{"id":"t3q24","q":"The ageing population creates demand for eldercare devices. This is innovation driven by _____.","o":["Employee Salaries","Stock Market Speculation","Demographic Changes","Franchise Fees"],"a":2,"x":"人口變化（Demographics）改變 customer needs，是 Innovation source。","kind":"Knowledge"},{"id":"t3q25","q":"A production line has a repeated bottleneck. A new method fixes it. What innovation source is shown?","o":["Personal Luck","Political Campaign","Random Advertising","Process Needs"],"a":3,"x":"流程需要（Process needs）指改善 process 中的缺口或弱點。","kind":"Application"},{"id":"t3q26","q":"Which is a barrier to innovation?","o":["Available Funding","Staff Training","Insufficient Resources","Supportive Leadership"],"a":2,"x":"資源不足（Insufficient resources）可限制 Innovation。","kind":"Knowledge"},{"id":"t3q27","q":"Why does an organisation need creativity and innovation?","o":["To survive and remain competitive","To remove all competitors immediately","To stop adapting to customer needs","To guarantee every new product succeeds"],"a":0,"x":"Creativity & Innovation 有助組織生存（Survival）、競爭力與回應環境變化。","kind":"Knowledge"},{"id":"t3q28","q":"Which strategy can encourage innovation?","o":["Change organisational culture to support new ideas","Refuse new information","Stop employee participation","Punish every failed trial"],"a":0,"x":"改變組織文化（Change Organisational Culture）能讓員工更願意提出 ideas。","kind":"Knowledge"},{"id":"t3q29","q":"What does “dare to fail” mean in entrepreneurship?","o":["Assume success is guaranteed","Never test ideas","Ignore all risks","Treat failure as feedback and learning"],"a":3,"x":"敢於失敗（Dare to Fail）不是盲目冒險，而是願意嘗試並從結果學習。","kind":"Knowledge"},{"id":"t3q30","q":"Which statement best summarises Topic 3?","o":["Innovation is only invention","New ideas never need evaluation","Creativity replaces all planning","Creativity develops useful ideas and innovation turns them into value"],"a":3,"x":"Topic 3 核心：產生有用 ideas，透過 Innovation 實踐，並克服 obstacles。","kind":"Knowledge"}]},"4":{"title":"創業環境評估","en":"Ventures Environment Assessment","questions":[{"id":"t4q1","q":"What are the TWO main categories of a venture's environment?","o":["Sales and Profit","Income and Expenses","Fixed and Flexible","Internal and External"],"a":3,"x":"課本把企業環境分為內部（Internal）與外部（External）；External 再分 Macro 和 Micro。","kind":"Knowledge"},{"id":"t4q2","q":"Which environment is generally the hardest for an entrepreneur to control?","o":["Staff Scheduling","Internal Structure","Macro Environment","Inventory Level"],"a":2,"x":"宏觀環境（Macro Environment）包含政治、經濟、社會文化及科技，企業難直接控制。","kind":"Knowledge"},{"id":"t4q3","q":"Which set lists the FOUR major macro-environment factors?","o":["Customer, supplier, employee, inventory","Bank, rent, payroll, packaging","Political/legal, economic, socio-cultural, technological","Brand, office, job title, profit"],"a":2,"x":"Macro 四類：Political and legislation、Economy、Socio-cultural、Technology。","kind":"Knowledge"},{"id":"t4q4","q":"Which is MOST clearly a political or legal factor?","o":["Customer preference for spicy food","A supplier's delivery speed","Employee creativity","Government regulations on product safety"],"a":3,"x":"政府規定（Regulation）和法律屬 Political and legislation environment。","kind":"Knowledge"},{"id":"t4q5","q":"A new tariff makes imported raw materials more expensive. This is mainly a change in _____.","o":["Organisational Culture","Customer Feedback","Team Building","Political/Legal Environment"],"a":3,"x":"關稅（Tariff）是政治與法律環境因素，會影響跨國貿易成本。","kind":"Knowledge"},{"id":"t4q6","q":"A large increase in interest rates changes the cost of business loans. Which macro factor is involved?","o":["Product Design only","Team Building","Economic Environment","Physical Layout"],"a":2,"x":"利率（Interest rate）是經濟（Economy）相關因素，影響 borrowing cost。","kind":"Application"},{"id":"t4q7","q":"A business studies local employment and inflation before opening. This is mainly _____.","o":["Team Training","Franchise Licensing","Creative Analogy","Economic Analysis"],"a":3,"x":"經濟環境（Economy）包括 labour market、industry conditions 等 macroeconomic indicators。","kind":"Application"},{"id":"t4q8","q":"More consumers work from home and prefer online shopping. This is mainly a ____ change.","o":["Supplier Credit","Factory Maintenance","Share Ownership","Socio-cultural"],"a":3,"x":"生活方式、工作方式與消費行為改變屬社會文化（Socio-cultural）因素。","kind":"Knowledge"},{"id":"t4q9","q":"An ageing community changes demand for healthcare products. This is an example of _____.","o":["Demographic Change","Organisational Structure","Advertising Cost only","Bank Interest"],"a":0,"x":"人口結構（Demographics）如 Age、Income、Education 等會影響 demand。","kind":"Application"},{"id":"t4q10","q":"A company uses a more efficient machine to reduce waste. Which macro force is involved?","o":["Technology","Politics only","Personal Hobby","Family Relationship"],"a":0,"x":"技術（Technology）發展能改善 production process，創造新 opportunity。","kind":"Application"},{"id":"t4q11","q":"Which is an example of process innovation in Topic 4?","o":["Improving an existing manufacturing method","Simply paying a bill","Changing the company logo only","Inventing an entirely unknown field"],"a":0,"x":"流程創新（Process innovation）改善設計、材料、生產或配送等方式。","kind":"Knowledge"},{"id":"t4q12","q":"Which is a MICRO-environment factor?","o":["Ageing population trend","National interest rate","Competitors","Global tariff policy"],"a":2,"x":"Micro environment 包括 Customers、Competitors、Suppliers、Financial Institutions、Government Agencies、NGOs。","kind":"Knowledge"},{"id":"t4q13","q":"A new competitor offers lower prices to the same customer group. Which factor should be analysed?","o":["Employee Benefits only","Political Stability only","Macro Inflation only","Competitors"],"a":3,"x":"競爭者（Competitors）滿足同類顧客需求，企業需比較其 Strengths / Weaknesses。","kind":"Application"},{"id":"t4q14","q":"A restaurant cannot operate because its ingredient supplier is unreliable. Which factor is involved?","o":["Population Ageing","Tax Policy only","Patent Law","Supplier"],"a":3,"x":"供應商（Suppliers）影響 Input price、quality 和 supply continuity。","kind":"Application"},{"id":"t4q15","q":"A bank requires collateral before approving a startup loan. Which micro actor is involved?","o":["Customer","Competitor","NGO","Financial Institution"],"a":3,"x":"金融機構（Financial Institutions）提供 external funding，並設定 loan conditions。","kind":"Application"},{"id":"t4q16","q":"A consumer association raises concerns about a product's packaging. This is most closely linked to _____.","o":["Business Owner's Hobby","Internal Staff Rotation","Cash Register","NGOs"],"a":3,"x":"非政府組織（NGOs）可透過資訊、campaign 和公共議題影響企業。","kind":"Application"},{"id":"t4q17","q":"Which is an INTERNAL environment element?","o":["Organisational Culture","Tariff Rates","Demographic Trends","National Unemployment Rate"],"a":0,"x":"Internal Environment 主要包含 Resources、Structure、Culture。","kind":"Knowledge"},{"id":"t4q18","q":"Which resource is an INTANGIBLE asset?","o":["Brand Reputation","Factory Machine","Office Building","Delivery Truck"],"a":0,"x":"品牌聲譽（Reputation）屬 Intangible resources，而機器和建築物屬 Tangible assets。","kind":"Knowledge"},{"id":"t4q19","q":"A firm changes its reporting lines to improve decision-making. It is changing its _____.","o":["Organisational Structure","Interest Rates","National Economic Policy","Customer Demographics"],"a":0,"x":"組織結構（Organisational Structure）影響權責與決策流程，是 Internal Environment。","kind":"Application"},{"id":"t4q20","q":"Why should a firm analyse strengths and weaknesses?","o":["To remove all market uncertainty","To guarantee a government grant","To evaluate internal capability before deciding a strategy","To avoid knowing competitors"],"a":2,"x":"企業策略需要先理解 Internal strengths and weaknesses。","kind":"Knowledge"},{"id":"t4q21","q":"Which statement best defines a business opportunity?","o":["Every product already in a warehouse","Any idea without customer demand","A guaranteed investment return","A concept that could create customer value and business profit when applied"],"a":3,"x":"商業機會（Business Opportunity）要有可轉化為有價值產品／服務與盈利的潛力。","kind":"Knowledge"},{"id":"t4q22","q":"According to the entrepreneurial process, what comes first?","o":["Corporate Bankruptcy","Recognition of Opportunity","Hiring All Employees","Paying Dividends"],"a":1,"x":"Entrepreneurial process 從辨認機會（Recognition of an Opportunity）開始。","kind":"Knowledge"},{"id":"t4q23","q":"An unexpected success reveals a new customer segment. Which Drucker opportunity source is this?","o":["New Knowledge only","Changes in Perception only","The Unexpected","Process Need"],"a":2,"x":"意外成功（Unexpected success）屬 Drucker 的 The Unexpected 機會來源。","kind":"Application"},{"id":"t4q24","q":"Customers say an existing service works differently from what businesses assume. This gap is _____.","o":["Capital Growth","Tariff Reduction","Incongruity","Employee Promotion"],"a":2,"x":"不一致（The Incongruous）指現實與假設、預期之間的落差。","kind":"Application"},{"id":"t4q25","q":"A medical discovery enables a new kind of diagnostic device. Which opportunity source is shown?","o":["Routine Payroll","New Knowledge","Office Rent","Supplier Conflict"],"a":1,"x":"新知識（New Knowledge）可產生新技術與創業機會。","kind":"Knowledge"},{"id":"t4q26","q":"What does E-commerce allow a small firm to do?","o":["Avoid all operating expenses","Remove the need for customer service","Reach customers online and offer information beyond normal store hours","Guarantee international profit"],"a":2,"x":"電子商務（E-commerce）可提供 24-hour information 與 online customer interaction，但仍有成本。","kind":"Knowledge"},{"id":"t4q27","q":"Which should be considered when evaluating a business opportunity?","o":["Only the office address","Only the owner's favourite brand","Only the product colour","Risk, return, competition and personal skills"],"a":3,"x":"評估機會（Opportunity Evaluation）需看 Risk & return、Competition、Value、Skills 等。","kind":"Knowledge"},{"id":"t4q28","q":"A venture may grow quickly but need repeated funding. What does this highlight?","o":["A guaranteed positive cash flow","No need for a business plan","The end of all risk","Magnitude and financing needs of the opportunity"],"a":3,"x":"機會規模（Magnitude of Opportunity）與 Growth 可能帶來持續 Financing pressure。","kind":"Knowledge"},{"id":"t4q29","q":"Which is a typical advantage of an ESTABLISHED company over a new firm?","o":["No need to adapt","Unlimited free capital","No competitors ever","Learning curve and reputation"],"a":3,"x":"Established firms 可能有 Learning curve、Reputation、Cash flow、Economies of scale 和 complementary assets。","kind":"Knowledge"},{"id":"t4q30","q":"What may help a NEW firm compete with established firms?","o":["Copying every old method without change","Serving unmet customer needs or using disruptive new competence","Depending only on company age","Ignoring every market signal"],"a":1,"x":"New firms 可利用既有企業忽略的 Needs 或新能力來建立機會。","kind":"Knowledge"}]},"5":{"title":"商業計劃","en":"Business Plan","questions":[{"id":"t5q1","q":"What is the main purpose of a Business Plan?","o":["To describe a venture's goals and how to achieve them","To guarantee a profit","To replace customer research","To avoid management decisions"],"a":0,"x":"商業計劃（Business Plan）像 Blueprint / Roadmap，說明 What、How、When、Where、Why。","kind":"Knowledge"},{"id":"t5q2","q":"Which question is MOST likely answered by a Business Plan?","o":["Can all competitors be banned?","What is the owner's favourite film?","How will the business reach its target customers?","Will every risk disappear?"],"a":2,"x":"Business Plan 應解釋市場、策略、資源和營運等實際問題。","kind":"Knowledge"},{"id":"t5q3","q":"Why should a business plan use realistic targets?","o":["They provide a measure for later performance review","They stop all market changes","They make losses impossible","They remove the need for resources"],"a":0,"x":"現實目標（Realistic targets）有助作為 Benchmark / Performance tool。","kind":"Knowledge"},{"id":"t5q4","q":"A plan helps a company state its mission and future direction. This supports _____.","o":["Employee Birthdays","Daily Weather Forecasting","Random Advertising","Mission and Vision"],"a":3,"x":"Mission and Vision 為企業提供方向及 decision-making 參考。","kind":"Application"},{"id":"t5q5","q":"Why is competitor analysis important in planning?","o":["It guarantees competitors will close","It prevents customer feedback","It helps compare rivals' strengths and weaknesses","It replaces marketing activities"],"a":2,"x":"Competitor Analysis 讓企業比較產品、market segment 和 Strengths / Weaknesses。","kind":"Knowledge"},{"id":"t5q6","q":"A bank reads a business plan before lending money. It is mainly assessing _____.","o":["The founder's preferred holiday","Staff uniform colours","Viability and repayment ability","The company's social media font"],"a":2,"x":"銀行／債權人關心 Business viability、Profitability、Finance 和 Repayment ability。","kind":"Application"},{"id":"t5q7","q":"Which stakeholder uses a business plan to judge product safety and price?","o":["Competitors only","Tax Inspectors only","Customers","Share Brokers only"],"a":2,"x":"Customers 關心 Quality、Safety、Price、Durability 和 After-sales support。","kind":"Knowledge"},{"id":"t5q8","q":"A supplier reviews whether to offer credit terms to a firm. What does it care about most?","o":["The number of office decorations","The font in the brand name","The firm's ability to pay","The owner's personal hobbies"],"a":2,"x":"Suppliers 關心是否能按 Credit terms 及時收到付款。","kind":"Application"},{"id":"t5q9","q":"How can a business plan help employees?","o":["It guarantees promotions for everyone","It shows business direction and growth prospects","It replaces all employment contracts","It eliminates performance reviews"],"a":1,"x":"Employees 可藉由計畫理解 company development、performance 和 stability。","kind":"Knowledge"},{"id":"t5q10","q":"Who uses a Business Plan to set tasks and monitor operations?","o":["Only Customers","Only Future Competitors","Management Team","Only Social Media Followers"],"a":2,"x":"Management Team 以 Business Plan 安排 responsibilities、benchmark 與 resources。","kind":"Knowledge"},{"id":"t5q11","q":"Which section summarises the entire business plan for quick reading?","o":["Supplier Invoice","Appendix","Monthly Attendance","Executive Summary"],"a":3,"x":"執行摘要（Executive Summary）概括 Venture、Management、Products、Finance 和 future plans。","kind":"Knowledge"},{"id":"t5q12","q":"Which Business Plan section examines industry outlook and target customers?","o":["Appendix","Market Analysis","Inventory Log only","Office Rules"],"a":1,"x":"市場分析（Market Analysis）研究 Industry、Target market、Competition 和 market test。","kind":"Knowledge"},{"id":"t5q13","q":"A company explains advertising, distribution and sales methods. This belongs to _____.","o":["Legal Structure only","Personal Resume","Risk-free Guarantee","Marketing and Sales Strategies"],"a":3,"x":"Marketing & Sales Strategies 涵蓋 Distribution、Promotion、Sales activities 和 budget。","kind":"Application"},{"id":"t5q14","q":"Which section should explain the main benefits and uniqueness of a new service?","o":["Share Certificate only","Service or Product Line","Company Parking Plan","Travel Insurance"],"a":1,"x":"服務／產品線（Service or Product Line）需解釋 uniqueness 和 customer benefits。","kind":"Knowledge"},{"id":"t5q15","q":"A chart showing managers, owners and reporting lines belongs mainly to _____.","o":["Organisation and Management","Product Packaging","Market Analysis","Cash Withdrawal"],"a":0,"x":"組織與管理（Organisation and Management）說明 Structure、Ownership 與 Management team。","kind":"Knowledge"},{"id":"t5q16","q":"Where should a company explain how much funding it needs and why?","o":["Brand Story Only","Customer Feedback Log","Funding Request","Office Announcement"],"a":2,"x":"資金要求（Funding Request）寫明 Amount、Use of Funds、future needs。","kind":"Knowledge"},{"id":"t5q17","q":"Which section usually contains cash-flow projections and financial statements?","o":["Company Logo Rules","Market Segments","Sales Slogan","Financials"],"a":3,"x":"財務（Financials）包含 Cash-flow projections、P&L 等資料。","kind":"Knowledge"},{"id":"t5q18","q":"Licences, permits, reference letters and detailed supporting records often belong in _____.","o":["Executive Summary only","Appendix","Mission Statement only","Product Name"],"a":1,"x":"附錄（Appendix）存放 supporting documents。","kind":"Knowledge"},{"id":"t5q19","q":"How many essential elements of a Good Business Plan are listed in the module?","o":["Twenty","Eight","Twelve","Three"],"a":1,"x":"教材列出八大元素（Eight Essential Elements）。","kind":"Knowledge"},{"id":"t5q20","q":"Why is an Executive Summary important?","o":["It is only for employees","It replaces the need for research","It helps readers understand key points quickly","It must contain every detailed contract"],"a":2,"x":"Executive Summary 是方便 stakeholders 快速理解整體 plan 的摘要。","kind":"Knowledge"},{"id":"t5q21","q":"What is the difference between a Funding Request and Financials?","o":["Financials only show company colours","Funding Request lists staff hobbies","They are identical","Funding Request states needs/uses; Financials provide projections"],"a":3,"x":"Funding Request 說明資金需求；Financials 展示 Cash flow、Profit / Loss 和其他 projections。","kind":"Knowledge"},{"id":"t5q22","q":"Which is a recommended Business Plan guideline?","o":["Use as much jargon as possible","Keep the plan short but informative","Hide the team's roles","Make unsupported forecasts"],"a":1,"x":"指引之一是 Keep the plan short，但不要刪去必要資訊。","kind":"Knowledge"},{"id":"t5q23","q":"What does “Be Focused” mean in planning?","o":["Avoid pursuing too many unrelated markets at once","Copy all competitors immediately","Ignore target markets","Make every product for everyone"],"a":0,"x":"Be Focused 指企業早期集中在清楚的 markets 和 priorities。","kind":"Knowledge"},{"id":"t5q24","q":"Why should a plan avoid jargon?","o":["Non-specialist readers need to understand it","It always lowers taxes","Jargon guarantees investors","It makes market research unnecessary"],"a":0,"x":"Avoid jargon 讓投資者與其他 stakeholders 容易理解。","kind":"Knowledge"},{"id":"t5q25","q":"A founder claims 1 million sales but has no market data. Which guideline is missing?","o":["Use more technical slang","Ignore competitors","Reduce customer research","Base information on study and evidence"],"a":3,"x":"資訊應有研究依據（Based on Study），不能只靠 unsupported estimates。","kind":"Application"},{"id":"t5q26","q":"What is wrong with a plan that has no deadlines or priorities?","o":["Too Much Clarity","Excessive Customer Research","No Realistic Goals","Too Many Verified Data"],"a":2,"x":"無 realistic goals 代表缺少 schedule、priority 和 action steps。","kind":"Knowledge"},{"id":"t5q27","q":"Why prepare contingencies in a Business Plan?","o":["To remove the need for teamwork","To guarantee no losses","To hide mistakes","To handle possible obstacles"],"a":3,"x":"應預測障礙（Anticipate obstacles）並準備應變方案（Contingencies）。","kind":"Knowledge"},{"id":"t5q28","q":"A founder refuses to invest effort and misses every agreed meeting. This shows _____.","o":["Good Financial Control","Clear Mission","Strong Team Building","No Commitment or Dedication"],"a":3,"x":"缺乏投入（No commitment/dedication）是課本列出的 planning pitfall。","kind":"Application"},{"id":"t5q29","q":"A founder has a product but cannot identify who would buy it. Which pitfall is this?","o":["Too Much Market Knowledge","No Market Niche","Overqualified Employees","Excessive Funding"],"a":1,"x":"沒有市場利基（No market niche）表示沒有清楚 target customers。","kind":"Application"},{"id":"t5q30","q":"What should an entrepreneur do if they lack technical experience?","o":["Ignore the weakness","Stop all research","Seek suitable qualified assistance","Invent financial records"],"a":2,"x":"缺乏 Business / Technical experience 時，可找 Qualified assistance。","kind":"Knowledge"}]},"6":{"title":"建立新的創業事業","en":"Starting a New Entrepreneurial Venture","questions":[{"id":"t6q1","q":"Which is NOT one of the three ways to enter a business discussed in Topic 6?","o":["Start-up","Buying a lottery ticket","Buying an Existing Business","Franchising"],"a":1,"x":"教材三種 Business entry：Start-up、Buying an Existing Business、Franchising。","kind":"Knowledge"},{"id":"t6q2","q":"What is a Start-up Company?","o":["A business that must be over 50 years old","A supplier's debt record","A newly established venture","Only a government agency"],"a":2,"x":"Start-up 是最近成立、從零發展的 venture。","kind":"Knowledge"},{"id":"t6q3","q":"Which is the correct order of Start-up phases?","o":["Planning, Bankruptcy, Merger only","Post Start-up, Pre Start-up, Start-up","Start-up, Post Start-up, Pre Start-up","Pre Start-up, Start-up, Post Start-up"],"a":3,"x":"課本三階段：Pre Start-up → Start-up → Post Start-up。","kind":"Knowledge"},{"id":"t6q4","q":"When does the Pre Start-up phase begin?","o":["After the company closes","When an initial business idea develops","After the founder retires","Only after the first dividend"],"a":1,"x":"Pre Start-up 由 idea inception 開始，到 business 準備開始營運。","kind":"Knowledge"},{"id":"t6q5","q":"Which is a common advantage of starting from zero?","o":["Freedom to choose location, product and employees","Guaranteed bank financing","An automatic existing customer base","A proven profit history"],"a":0,"x":"Start-up 的優點是自主選擇 Location、Employees、Products 等。","kind":"Knowledge"},{"id":"t6q6","q":"Which is a major disadvantage of a new Start-up?","o":["Receiving guaranteed revenue","No historical sales data to forecast with","Inheriting a proven brand reputation","Having too many existing customers"],"a":1,"x":"新 venture 通常缺少 Past sales/expense/profit data，且需要建立 customer base。","kind":"Knowledge"},{"id":"t6q7","q":"What is buying an existing business?","o":["Acquiring an existing firm's shares or assets","Selling personal insurance","Creating a new business idea without operations","Only renting a shop for one day"],"a":0,"x":"Buying existing business 可購買 Shares 或 Assets，接手已建立的業務。","kind":"Knowledge"},{"id":"t6q8","q":"Before buying a business, the entrepreneur should first _____.","o":["sign any agreement immediately","ignore previous records","identify personal priorities and business goals","stop researching the market"],"a":2,"x":"第一步 Personal Priority：想清楚期待收入、commitment、興趣和能力。","kind":"Knowledge"},{"id":"t6q9","q":"What is “Due Diligence” in a business acquisition?","o":["A special marketing slogan","A company celebration","Careful investigation of the target business","Only signing the invoice"],"a":2,"x":"盡職調查（Due Diligence）是收購前調查 Financial、Legal、Assets、Risks 等。","kind":"Knowledge"},{"id":"t6q10","q":"Which record is especially useful when assessing an existing business?","o":["The owner's favourite music","Past financial and tax records","Employees' shoe sizes","Last week's weather"],"a":1,"x":"Review Potential Target 時應檢查以往 Financial / tax data 和 assets。","kind":"Knowledge"},{"id":"t6q11","q":"Which is an advantage of buying an existing business?","o":["Guaranteed free purchase","No need for investigation","No past business activities at all","An existing customer base and reputation"],"a":3,"x":"Existing customers、reputation、inventory 和 proven market 是收購優勢。","kind":"Knowledge"},{"id":"t6q12","q":"What is a possible hidden disadvantage of buying a business?","o":["An established distribution network","Uncollectable receivables or obsolete stock","Experienced employees","Immediate proven sales"],"a":1,"x":"Receivables 可能收不回，Inventory / equipment 可能過時。","kind":"Knowledge"},{"id":"t6q13","q":"Why might banks be more willing to finance an existing business?","o":["It requires no repayment","It has no records to review","It has an operating and financial track record","Every purchase is risk-free"],"a":2,"x":"Existing business 有 past performance，lender 較能評估。","kind":"Knowledge"},{"id":"t6q14","q":"A buyer discovers unpaid supplier contracts after purchasing a firm. This is related to _____.","o":["Creativity Process","Post Start-up only","Outstanding Contracts","Brand Name Appeal"],"a":2,"x":"Outstanding contracts / liabilities 可能成為 acquisition 障礙。","kind":"Application"},{"id":"t6q15","q":"Who is the Franchisor?","o":["A bank debt collector","Only the customer buying goods","The party granting the brand or system rights","The employee taking annual leave"],"a":2,"x":"Franchisor 是授權使用品牌／系統的一方；Franchisee 是加盟經營者。","kind":"Knowledge"},{"id":"t6q16","q":"Who is the Franchisee?","o":["A stock-market regulator","The original owner of every trademark","The government tax authority","The party receiving the right to operate under the system"],"a":3,"x":"Franchisee 購買使用 Franchise system / brand 的權利。","kind":"Knowledge"},{"id":"t6q17","q":"Which is a typical franchising advantage?","o":["Training and guidance from the franchisor","No initial investment","Guaranteed success","Complete freedom from operating rules"],"a":0,"x":"加盟優點包括 Training、Brand name、Proven track record、可能的 Financial assistance。","kind":"Knowledge"},{"id":"t6q18","q":"Why is “Brand Name Appeal” useful to a Franchisee?","o":["It guarantees exclusive world markets","Customers may already recognise the brand","It prevents customer complaints","It removes every operating expense"],"a":1,"x":"品牌知名度（Brand name appeal）有助吸引已有 Awareness 的顧客。","kind":"Knowledge"},{"id":"t6q19","q":"Which is a common franchising disadvantage?","o":["Franchise fees and ongoing royalties","No franchise agreement","No brand standards","Total independence in all decisions"],"a":0,"x":"Franchise 常有 Initial fee、Royalty、inventory 等成本。","kind":"Knowledge"},{"id":"t6q20","q":"Why may a Franchisee have limited operating freedom?","o":["Only banks can make menus","Franchisees never hire employees","The Franchisor requires system uniformity","Customers select the entire business law"],"a":2,"x":"Franchisor control 用來維持 Uniformity，因此 Franchisee 自主性有限。","kind":"Knowledge"},{"id":"t6q21","q":"Which legal structure has ONE owner who is personally responsible for business debts?","o":["Franchise Association","Corporation with limited liability","Sole Proprietorship","Public Stock Market"],"a":2,"x":"獨資（Sole Proprietorship）一般有 Unlimited liability，owner 和 business 未分離。","kind":"Knowledge"},{"id":"t6q22","q":"What is Unlimited Liability?","o":["Personal assets may be used to settle business debts","The business can never lose money","The owner owes no debts","Shares always rise in value"],"a":0,"x":"無限責任（Unlimited Liability）可能涉及 owner 的 personal assets。","kind":"Knowledge"},{"id":"t6q23","q":"A Partnership usually involves _____.","o":["two or more co-owners","only one shareholder by definition","government ownership only","no agreement about profits"],"a":0,"x":"合夥（Partnership）一般由兩人或以上共同經營並分享 Profit / Loss。","kind":"Knowledge"},{"id":"t6q24","q":"Why is a written Partnership Agreement useful?","o":["It clarifies contributions, roles, profit and loss sharing","It makes all conflicts impossible","It guarantees every partner equal skills","It removes the need for employees"],"a":0,"x":"書面 Partnership Agreement 可規定 roles、contributions、profit / loss、退出等。","kind":"Knowledge"},{"id":"t6q25","q":"Which is a characteristic of a Corporation?","o":["It always has unlimited owner liability","It cannot own assets","It is a separate legal entity","It stops existing whenever an employee leaves"],"a":2,"x":"公司（Corporation）與 owners 分開，是 Separate Legal Entity。","kind":"Knowledge"},{"id":"t6q26","q":"Which is usually a corporation's advantage?","o":["Mandatory unlimited liability for all shareholders","Limited liability and continuity","No regulation of any kind","No formation costs ever"],"a":1,"x":"Corporation 的優勢包括 Limited Liability、Transferable Ownership、Continuity。","kind":"Knowledge"},{"id":"t6q27","q":"Which legal structure is generally easiest to start and has only one owner?","o":["Multinational Holding Company","Large Corporation","Government Agency","Sole Proprietorship"],"a":3,"x":"獨資（Sole Proprietorship）通常成立較簡單、決策集中。","kind":"Knowledge"},{"id":"t6q28","q":"Which is NOT one of the six sources of capital listed in Topic 6?","o":["Guaranteed lottery winnings","Family and Friends","Government Loans","Personal Funds"],"a":0,"x":"六來源包括 Personal funds、Family and friends、Retirement accounts、Banks、Government loans、Stock markets。","kind":"Knowledge"},{"id":"t6q29","q":"Why should borrowing from friends or family be documented?","o":["To avoid knowing the loan amount","To remove the need to repay","To hide business losses","To clarify repayment terms and avoid future disputes"],"a":3,"x":"與家人朋友借款也應記下 Loan terms，以免產生誤會。","kind":"Knowledge"},{"id":"t6q30","q":"Which source of capital may require collateral and formal loan terms?","o":["Personal Hobbies","Customer Complaints","Banks and Financial Institutions","Free Samples"],"a":2,"x":"銀行與金融機構（Financial Institutions）常要求 Collateral 及 Formal repayment terms。","kind":"Knowledge"}]},"7":{"title":"企業家網絡","en":"Entrepreneurial Networking","questions":[{"id":"t7q1","q":"What is the main purpose of business networking?","o":["Collecting business cards without any follow-up","Avoiding all contact with other firms","Building relationships that provide resources and opportunities","Replacing every business plan"],"a":2,"x":"人際網絡（Networking）透過互動建立資源、機會和互惠關係。","kind":"Knowledge"},{"id":"t7q2","q":"Networking can be viewed as a result of past relationships and a resource for _____.","o":["personal holidays only","employee uniforms","office decoration","future business strategies"],"a":3,"x":"課本指出 Networking 既是過去 relationship strategy 的結果，也是 future strategy 的 resource。","kind":"Knowledge"},{"id":"t7q3","q":"Which is one of the THREE advantages of good networking listed in Topic 7?","o":["Automatic Tax Exemption","Fixed Exchange Rates","Guaranteed Monopoly","Accessibility"],"a":3,"x":"三項優勢：Accessibility、Reputation、Expectations。","kind":"Knowledge"},{"id":"t7q4","q":"Financial support and technology transfer are examples of _____.","o":["negative expressions","tangible resources gained through networking","no business value","legal restrictions only"],"a":1,"x":"Networking 的 Tangible resources 包括 Finance、Technology 和 Information access。","kind":"Knowledge"},{"id":"t7q5","q":"Moral support and guidance through networking are _____.","o":["corporate tax expenses","intangible resources","fixed assets","franchise royalties"],"a":1,"x":"Intangible resources 包括 Moral support、Guidance、Confidence。","kind":"Knowledge"},{"id":"t7q6","q":"A founder is trusted because of expertise and leadership. Which networking advantage is shown?","o":["Tariff Reduction","Reputation","Market Monopoly","Physical Asset Control"],"a":1,"x":"聲譽（Reputation）可讓 network members 更重視 Entrepreneur 的產品和建議。","kind":"Application"},{"id":"t7q7","q":"Network partners expect a firm to act fairly even during shortages. This reflects _____.","o":["Depreciation","Loan Default","Invention","Expectations"],"a":3,"x":"Expectations 既能支持也能限制企業行為，例如公平定價與 Ethics。","kind":"Knowledge"},{"id":"t7q8","q":"What makes networking strategic?","o":["Avoiding cooperation with competitors","Meeting people with no purpose or follow-up","Linking relationships to clear business goals and planned actions","Only sending advertisements to strangers"],"a":2,"x":"Strategic Networking 要先明確 Goals & Objectives，再決定怎樣建立關係。","kind":"Knowledge"},{"id":"t7q9","q":"Why is planning important for Strategic Networking?","o":["It guarantees every contact becomes a customer","It prevents business changes","It removes the need to listen","It helps identify who can support the firm's goals"],"a":3,"x":"有效 Networking 需要 Planning、Construction 和 Execution。","kind":"Knowledge"},{"id":"t7q10","q":"Which is an example of Formal Networking?","o":["A family dinner unrelated to business","A casual chat with a childhood friend","A hobby club conversation with no planned business purpose","A structured relationship with suppliers and business partners"],"a":3,"x":"正式網絡（Formal Networking）常涉及 business-related、互惠的結構性關係。","kind":"Knowledge"},{"id":"t7q11","q":"Which is an example of Informal Networking?","o":["Advice from a childhood friend or family member","A corporate board report only","A signed franchising contract only","A statutory tax return"],"a":0,"x":"非正式網絡（Informal Networking）可來自 Friends、Family、Hobbies、Mentors 等。","kind":"Knowledge"},{"id":"t7q12","q":"How can informal networking help entrepreneurs?","o":["Provide advice, support and useful information","Replace all formal contracts","Guarantee large profits without work","Eliminate market competition"],"a":0,"x":"Informal Networking 可提供 Information、Opinion、Moral / Financial support。","kind":"Knowledge"},{"id":"t7q13","q":"Which of the following is NOT one of the six importance of networking in the module?","o":["Reduce Bureaucracy","Build Confidence","Develop Trust","Guarantee Market Leadership"],"a":3,"x":"六項包括 Build confidence、Reduce bureaucracy、Increase information、Develop trust、Interdependence、Source of creativity。","kind":"Knowledge"},{"id":"t7q14","q":"How can networking help reduce bureaucracy?","o":["Guarantee instant permits","Cancel all management tasks","Speed up applications and avoid repeated mistakes","Ignore all laws"],"a":2,"x":"Reduce Bureaucracy 指減少 red tape、節省 time/resources，不是可以不守法。","kind":"Knowledge"},{"id":"t7q15","q":"A founder learns who can provide packaging and delivery services. This is _____.","o":["Increase Information","Eliminate Competition","Reduce Product Quality","Avoid Customer Research"],"a":0,"x":"增加資訊（Increase Information）能協助認識 network 裡的 people 和 resources。","kind":"Application"},{"id":"t7q16","q":"Why is trust important in business networking?","o":["It makes contracts unnecessary in every case","It removes all operational risks","Partners may prioritise the firm's products and recommend them","It makes pricing irrelevant"],"a":2,"x":"信任（Develop Trust）可推動 word-of-mouth 和 cooperative priority。","kind":"Knowledge"},{"id":"t7q17","q":"The idea of give-and-take in networking reflects _____.","o":["Tax Evasion","Market Closure","Interdependence","Extreme Isolation"],"a":2,"x":"互賴（Interdependent Situation）強調互惠與彼此貢獻。","kind":"Knowledge"},{"id":"t7q18","q":"A customer suggests a more convenient delivery process. Which networking benefit is shown?","o":["Financial Insolvency","No Need for Research","Source of Creativity","Guaranteed Capital"],"a":2,"x":"Networking 可成為創意來源（Source of Creativity），Customer、Supplier、Worker 都能提供 ideas。","kind":"Application"},{"id":"t7q19","q":"Which step should come first when establishing Strategic Networking?","o":["Avoiding business goals","Giving expensive gifts immediately","Signing every possible agreement","Good Planning"],"a":3,"x":"建立 Strategic Networking 首先需要 Good Planning 和明確 Goals。","kind":"Knowledge"},{"id":"t7q20","q":"Entrepreneurs may join relevant business associations mainly to _____.","o":["guarantee tax refunds","avoid building relationships","meet useful contacts and learn networking techniques","replace all employees"],"a":2,"x":"參與 Associations / Meetings 可建立 contact 和學習 Networking techniques。","kind":"Knowledge"},{"id":"t7q21","q":"Which behaviour supports effective networking?","o":["Demanding agreement from everyone","Ignoring criticism and feedback","Insulting competitors publicly","Being ready to listen and compromise"],"a":3,"x":"課本強調 Ready to listen、Compromise、Confidence、Remain calm。","kind":"Knowledge"},{"id":"t7q22","q":"Why should an entrepreneur maintain contacts even without current business deals?","o":["Every contact is legally required to buy products","It avoids all future competition","It guarantees a grant","Relationships may be useful for future opportunities"],"a":3,"x":"Networking Consolidation 強調長期維護 relationships，而非只聯絡當前有交易的人。","kind":"Knowledge"},{"id":"t7q23","q":"Which action is a networking-consolidation technique in the textbook?","o":["Ignoring all meeting invitations","Refusing to exchange contact information","Only contacting someone when collecting debt","Replying to professional emails and attending formal functions"],"a":3,"x":"課本列出 Visits、Formal functions、Cards、Letters/E-mails 等方式。","kind":"Knowledge"},{"id":"t7q24","q":"Which is one of the seven techniques for developing confidence?","o":["Never admit mistakes","Avoid helping others","Always dominate conversations","Communicate effectively and confidently"],"a":3,"x":"七大技巧之一是 Communicate Effectively and with Full Confidence。","kind":"Knowledge"},{"id":"t7q25","q":"Why should entrepreneurs admit their mistakes?","o":["It guarantees every partner agrees","It proves they should stop all business","It removes legal responsibility automatically","It builds trust through sincerity and humility"],"a":3,"x":"承認錯誤（Admit Own Mistakes）展現 Humility 與 Sincerity。","kind":"Knowledge"},{"id":"t7q26","q":"What does showing teamwork spirit mean?","o":["Keeping information away from everyone","Blaming the team for all problems","Helping members feel they belong and working together","Making every decision secretly"],"a":2,"x":"Show Teamwork Spirit 強調合作、歸屬感與共同解決問題。","kind":"Knowledge"},{"id":"t7q27","q":"Which is an EMOTIONAL barrier to networking?","o":["Fairness","Arrogance and refusal to admit mistakes","Mutual respect","Effective listening"],"a":1,"x":"Emotional barriers 包括 Arrogance、Fear、Aggressiveness、Ego 等。","kind":"Knowledge"},{"id":"t7q28","q":"A founder avoids eye contact and displays an unfriendly expression. This is mainly a ____ barrier.","o":["Technology","Physical","Legal","Financial"],"a":1,"x":"課本 Physical barriers 包括衣著、眼神、姿態、語氣等外在表現。","kind":"Application"},{"id":"t7q29","q":"Excessive shyness and fear of social rejection are closest to ____ barriers.","o":["Psychological","Tariff","Production","Investment"],"a":0,"x":"Psychological barriers 包括 Nervousness、Shyness、Frustration 等。","kind":"Knowledge"},{"id":"t7q30","q":"Ridiculing other people's ideas is an example of _____.","o":["Successful Conflict Resolution","Opportunity Evaluation","Negative Expressions / Behavioural barriers","Effective Team Building"],"a":2,"x":"嘲諷他人、傲慢表達會阻礙 Networking trust，屬負面表達與行為障礙。","kind":"Knowledge"}]},"8":{"title":"創業機會評估","en":"Evaluation of Entrepreneurial Opportunities","questions":[{"id":"t8q1","q":"What is the main purpose of evaluating an entrepreneurial opportunity?","o":["To guarantee a profit for every idea","To avoid studying customers","To replace all business planning","To test whether a new venture is worth pursuing"],"a":3,"x":"Opportunity Evaluation 先分析 Idea、Market、Finance 和 Risks，判斷 Venture 是否值得實行。","kind":"Knowledge"},{"id":"t8q2","q":"Which is one of the six pitfalls in selecting a new venture?","o":["Strong Technical Knowledge","Careful Market Research","Lack of Objective Evaluation","Clear Financial Planning"],"a":2,"x":"六個 Pitfalls 之一是缺乏客觀評估（Lack of Objective Evaluation）。","kind":"Knowledge"},{"id":"t8q3","q":"A founder believes every personal idea will succeed and refuses critical feedback. This shows _____.","o":["Effective Risk Control","Lack of Objective Evaluation","Good Feasibility Testing","Strong Market Analysis"],"a":1,"x":"太依戀自己的 Idea 而不客觀驗證，是評估陷阱。","kind":"Application"},{"id":"t8q4","q":"A founder ignores product life cycle and customer demand. Which pitfall is this?","o":["Good Buyer Decision Analysis","Strong Production Planning","No Real Insight into the Market","Team Building"],"a":2,"x":"不了解市場（No Real Insight into the Market）會忽略 Demand、Product life cycle 和 Timing。","kind":"Application"},{"id":"t8q5","q":"A startup cannot manufacture its design because no one understands the required technology. Which pitfall applies?","o":["Clear Customer Segments","High Market Knowledge","Inadequate Technical Understanding","Good Financial Control"],"a":2,"x":"Technical Understanding 不足會令 Development 成本和時間失控。","kind":"Application"},{"id":"t8q6","q":"A business severely underestimates production and development costs. This is _____.","o":["Customer Loyalty","Strong Financial Planning","Successful Product Testing","Poor Financial Understanding"],"a":3,"x":"財務理解不足（Poor Financial Understanding）會忽略真實成本。","kind":"Application"},{"id":"t8q7","q":"A new service looks exactly like competitors' services and offers no clear benefit. This is _____.","o":["Lack of Venture Uniqueness","Strong Competitive Advantage","Market Innovation","High Product Differentiation"],"a":0,"x":"缺乏獨特性（Lack of Venture Uniqueness）使 Customer 難看出差別。","kind":"Application"},{"id":"t8q8","q":"A new venture sells a product without considering copyright requirements. Which pitfall is shown?","o":["Ignorance of Legal Issues","Strong Financial Management","Good Market Timing","Proven Technical Feasibility"],"a":0,"x":"忽略法律（Ignorance of Legal Issues）可能涉及 Copyright、Patent、Workplace Safety 等。","kind":"Application"},{"id":"t8q9","q":"Which is a basic-feasibility question?","o":["How many photos are on Instagram?","Can the product work and can it be sold legally?","Will every competitor close?","Does the founder like blue logos?"],"a":1,"x":"Basic Feasibility 檢查 Product/Service 可否運作且合乎法律。","kind":"Knowledge"},{"id":"t8q10","q":"What is the main focus of Competitive Advantages in New Venture Development?","o":["How many holidays workers take","Whether the founder owns a car","What makes the product better than alternatives","Which font is used in invoices"],"a":2,"x":"Competitive Advantage 評估優勢及 Competitors 可能如何回應。","kind":"Knowledge"},{"id":"t8q11","q":"What does Buyer Decision analysis investigate?","o":["Who customers are and how much they may buy","Only the office layout","Only the founder's personal spending","Only the company's legal name"],"a":0,"x":"Buyer Decision 分析 Customer characteristics、quantity 和購買決定。","kind":"Knowledge"},{"id":"t8q12","q":"Which critical factor asks about advertising cost and market share?","o":["Fixed Assets only","Staffing","Legal Structure","Marketing"],"a":3,"x":"Marketing factor 涉及 Advertising budget、Sales activities、Market share 等。","kind":"Knowledge"},{"id":"t8q13","q":"“Make or buy?” is mainly a question in which critical factor?","o":["Buyer Decision","Reputation","Bankruptcy","Production"],"a":3,"x":"Production factor 研究自製或外購（Make or buy）、Supplier availability 和 Input cost。","kind":"Knowledge"},{"id":"t8q14","q":"Which critical factor deals with hiring and employee competence?","o":["Staffing","Product Packaging","Shareholder Dividends","Demographics only"],"a":0,"x":"Staffing 評估是否具備 Skilled people 和 Hiring arrangements。","kind":"Knowledge"},{"id":"t8q15","q":"Which factor involves keeping records and setting controls?","o":["Brand Appeal","Socio-cultural Trends","Personal Satisfaction","Control"],"a":3,"x":"Control 包括 Records 和必要的 operational controls。","kind":"Knowledge"},{"id":"t8q16","q":"Which critical factor estimates development costs and working capital?","o":["Customer Colour Preference","Advertising Copywriting only","Building Reception","Financing"],"a":3,"x":"Financing 評估 Development、Working Capital、Sources 和 Cost of funding。","kind":"Knowledge"},{"id":"t8q17","q":"How many critical factors for new venture development are discussed in the module?","o":["Two","Sixteen","Twenty","Eight"],"a":3,"x":"教材列出八項 Critical Factors：Feasibility、Competition、Buyers、Marketing、Production、Staffing、Control、Financing。","kind":"Knowledge"},{"id":"t8q18","q":"Which group represents the THREE major causes of new venture failure?","o":["Only design, colour, and size","Product/market, financial, managerial problems","Only capital, salary, and insurance","Only tax, weather, and holidays"],"a":1,"x":"課本把 Failure 原因分 Product/Market、Financial 和 Managerial 三大類。","kind":"Knowledge"},{"id":"t8q19","q":"Launching a product before the market is ready is a ____ problem.","o":["Legal Entity","Network Confidence","Product / Market","Retirement Savings"],"a":2,"x":"Poor Timing 屬 Product/Market problems。","kind":"Knowledge"},{"id":"t8q20","q":"A startup has too little capital for its early operating costs. This is _____.","o":["Effective Financing","Overstaffing only","Market Segmentation","Initial Undercapitalisation"],"a":3,"x":"初始資金不足（Initial undercapitalisation）是 Financial difficulty。","kind":"Application"},{"id":"t8q21","q":"A business fails because its management team cannot cooperate. This is mainly _____.","o":["Product Packaging","Managerial Problem","Interest Income","Demographic Shift"],"a":1,"x":"管理問題（Managerial Problems）包括 team conflicts、poor relationships 和 weak support。","kind":"Application"},{"id":"t8q22","q":"What is the FIRST approach mentioned in the textbook's Evaluation Process?","o":["Asking the Right Questions","Hiring All Staff","Setting Dividend Policy","Printing Business Cards"],"a":0,"x":"Evaluation Process 第一個方法是 Asking the Right Questions。","kind":"Knowledge"},{"id":"t8q23","q":"Which question is useful when evaluating a new product idea?","o":["Has the prototype been tested properly?","Does every neighbour like the logo?","Will every idea become a patent?","Can the founder avoid all laws?"],"a":0,"x":"Questioning 應包括 Product testing、Market、Cost、Distribution 和 Competition。","kind":"Knowledge"},{"id":"t8q24","q":"What does Profile Analysis study?","o":["Only the founder's face and clothing","Only tax rates without context","The combined effect of several venture-success variables","Only advertising slogans"],"a":2,"x":"Profile Analysis 觀察多個 Variables 的組合如何影響 success。","kind":"Knowledge"},{"id":"t8q25","q":"Which is an example of Feasibility Criteria?","o":["The founder's favourite colour","Realistic costs, market potential and expected margins","The company's birthday","Number of personal followers only"],"a":1,"x":"Feasibility Criteria 涵蓋 Market、Cost、Margin、Break-even 和 Competitive issues。","kind":"Knowledge"},{"id":"t8q26","q":"Technical Feasibility mainly asks whether _____.","o":["the website uses fashionable colours","the team has nice uniforms","the manager enjoys the idea","the product works reliably and meets design needs"],"a":3,"x":"Technical Feasibility 評估 Functional design、Durability、Reliability 等。","kind":"Knowledge"},{"id":"t8q27","q":"Marketability focuses mainly on _____.","o":["employees' entertainment preference","the company's computer wallpaper","the office lease only","market demand and sales potential"],"a":3,"x":"Marketability 看 Customer demand、Market potential、Pricing 和 Competitors。","kind":"Knowledge"},{"id":"t8q28","q":"A new device works perfectly but no one wants to buy it. Which evaluation area is weak?","o":["Marketability","Product Reliability","Technical Feasibility","Functional Design"],"a":0,"x":"技術可行不代表有市場；這個案例弱在 Marketability。","kind":"Knowledge"},{"id":"t8q29","q":"A business has strong customer demand but cannot make the product safely. What is weak?","o":["Marketability","Customer Awareness","Technical Feasibility","Market Segmentation"],"a":2,"x":"市場有 Demand 不代表做得出安全產品；弱在 Technical Feasibility。","kind":"Application"},{"id":"t8q30","q":"Which statement best summarises a good opportunity evaluation?","o":["Study market, technical, financial and managerial feasibility together","Judge only by personal enthusiasm","Ignore competitors","Skip testing whenever a product is new"],"a":0,"x":"完整 Feasibility Evaluation 需要多面向檢查，而非只靠單一 Idea 或熱情。","kind":"Knowledge"}]},"9":{"title":"個人財務規劃","en":"Entrepreneur and Personal Financial Planning","questions":[{"id":"t9q1","q":"What is Personal Financial Planning?","o":["A process for managing money to achieve life goals","A way to guarantee high returns","A method of avoiding all expenses","A product sold only by banks"],"a":0,"x":"個人財務規劃（Personal Financial Planning）是一個持續過程（Process），不是單一 Product。","kind":"Knowledge"},{"id":"t9q2","q":"What is the FIRST step in personal financial planning?","o":["Assess your present financial position","Borrow as much as possible","Buy expensive insurance immediately","Stop recording expenses"],"a":0,"x":"課本五步驟先 Assess where you are now，即了解目前財務狀況。","kind":"Knowledge"},{"id":"t9q3","q":"Which step comes AFTER setting financial goals?","o":["Creating a Financial Plan","Ignoring Income","Cancelling All Savings","Applying for Bankruptcy"],"a":0,"x":"五步驟：Assess → Set Goals → Create Plan → Implement → Monitor and Reassess。","kind":"Knowledge"},{"id":"t9q4","q":"Why must a financial plan be reviewed regularly?","o":["The plan will always stay perfect","Life circumstances and income may change","Expenses are always fixed","Interest rates never change"],"a":1,"x":"監控與重新評估（Monitoring and Reassessing）用於應對生活／收入／支出變化。","kind":"Knowledge"},{"id":"t9q5","q":"Which is a benefit of financial planning?","o":["Guaranteed investment success","No need to consider future needs","Better control of spending and debt","Freedom from all emergencies"],"a":2,"x":"Financial Planning 有助控制支出、管理債務、準備未來 Goals。","kind":"Knowledge"},{"id":"t9q6","q":"Which life event may change a person's financial priorities?","o":["Marriage and having children","Changing phone wallpaper","Watching a film","Listening to music"],"a":0,"x":"人生階段（Life stages）如 Marriage、Children、Retirement 會改變 Financial goals。","kind":"Knowledge"},{"id":"t9q7","q":"A student plans to save money for a laptop in eight months. This is generally a ____ goal.","o":["Medium-term","Short-term","Long-term","Retirement-only"],"a":1,"x":"Short-term goals 通常在一年內。","kind":"Application"},{"id":"t9q8","q":"Saving for a house deposit in two years is generally a ____ goal.","o":["Not a financial goal","Short-term only","Medium-term","Long-term over 10 years"],"a":2,"x":"Medium-term 常指 1–3 年左右。","kind":"Knowledge"},{"id":"t9q9","q":"Saving steadily for retirement in 25 years is a ____ goal.","o":["Monthly expense","Long-term","Cash advance","Short-term"],"a":1,"x":"Long-term goals 通常超過 3 年；Retirement 是常見例子。","kind":"Knowledge"},{"id":"t9q10","q":"Why should financial goals be written clearly?","o":["To avoid setting priorities","To remove all risk","To make them specific and easier to track","To guarantee a bigger salary"],"a":2,"x":"清楚的 Financial goals 應可量度、可追蹤，有助設定 Priority。","kind":"Knowledge"},{"id":"t9q11","q":"According to the module, an emergency fund should ideally cover at least about ____ of basic expenses.","o":["one day","two weeks","one week","six months"],"a":3,"x":"課本建議 Emergency Fund 至少約 6 個月 basic living expenses，理想可更高。","kind":"Knowledge"},{"id":"t9q12","q":"Why is an Emergency Fund important?","o":["It removes all monthly bills","It guarantees stock market returns","It helps handle unexpected expenses without relying immediately on debt","It must only be used for holidays"],"a":2,"x":"應急金（Emergency Fund）用於突發支出與收入中斷。","kind":"Knowledge"},{"id":"t9q13","q":"Which item is an Asset?","o":["Unpaid car loan","Money in a savings account","Outstanding credit-card debt","Unpaid utility bill"],"a":1,"x":"資產（Asset）是你擁有的有價值項目，例如 Savings、Property、Shares。","kind":"Knowledge"},{"id":"t9q14","q":"Which is a Liability?","o":["Unit trust holdings","Cash in wallet","A debt-free motorcycle owned by you","Outstanding housing loan"],"a":3,"x":"負債（Liability）是欠別人的款項，例如 Loans 和 Credit card debt。","kind":"Knowledge"},{"id":"t9q15","q":"Which formula calculates Net Worth?","o":["Savings plus Debts","Assets minus Liabilities","Income plus Expenses","Liabilities minus Assets"],"a":1,"x":"淨值（Net Worth）= Total Assets − Total Liabilities。","kind":"Knowledge"},{"id":"t9q16","q":"A person has RM40,000 in assets and RM15,000 in liabilities. What is the net worth?","o":["RM25,000","RM40,000","RM15,000","RM55,000"],"a":0,"x":"Net Worth = RM40,000 − RM15,000 = RM25,000。","kind":"Application"},{"id":"t9q17","q":"A person has RM20,000 in assets and RM30,000 in liabilities. Their net worth is _____.","o":["negative RM10,000","zero","positive RM50,000","positive RM10,000"],"a":0,"x":"Assets 小於 Liabilities，淨值為 -RM10,000（Negative Net Worth）。","kind":"Application"},{"id":"t9q18","q":"Why can a person with positive net worth still face cash problems?","o":["All property sells instantly","Liabilities cannot be paid with money","Some assets may not be liquid","Positive net worth means unlimited cash"],"a":2,"x":"流動性（Liquidity）指資產能否快速變現；資產多不代表手上有 Cash。","kind":"Knowledge"},{"id":"t9q19","q":"Which is a sensible way to improve net worth?","o":["Spend more than income every month","Borrow without a repayment plan","Avoid tracking finances","Increase savings and reduce debt"],"a":3,"x":"增加 Assets / Savings、減少 Liabilities 可改善 Net Worth。","kind":"Knowledge"},{"id":"t9q20","q":"What is a Personal Budget?","o":["A plan for income, saving and spending","A replacement for bank statements","A guarantee of future salary","A list of only past holidays"],"a":0,"x":"預算（Budget）是對預計 income、saving 和 spending 的計畫。","kind":"Knowledge"},{"id":"t9q21","q":"Which is normally a Fixed Expense?","o":["Random holiday souvenir","Unplanned gift","Monthly rental payment","Occasional movie ticket"],"a":2,"x":"固定支出（Fixed Expense）如 Rent、Loan instalment、Insurance premium。","kind":"Knowledge"},{"id":"t9q22","q":"Which is usually a Variable Expense?","o":["A loan's fixed monthly instalment","An annual school timetable","Groceries and petrol","Company registration number"],"a":2,"x":"變動支出（Variable Expenses）如 Groceries、Petrol、Utilities，金額會波動。","kind":"Knowledge"},{"id":"t9q23","q":"Which is a Discretionary Expense?","o":["Mandatory loan repayment","Required rent payment","Entertainment and hobbies","Basic electricity bill"],"a":2,"x":"可選擇支出（Discretionary Expense）如 Entertainment、Hobbies、Holiday。","kind":"Knowledge"},{"id":"t9q24","q":"According to the module, which saving habit is encouraged?","o":["Use credit cards as savings","Avoid any emergency fund","Save only if there is money after every luxury purchase","Save part of your income regularly"],"a":3,"x":"課本鼓勵定期儲蓄，並提到至少約 10% income 的學習建議。","kind":"Knowledge"},{"id":"t9q25","q":"What is the difference between a Budget and a Cash Flow Statement?","o":["Budget is planned; Cash Flow is actual money in/out","They are always identical","Cash Flow contains only stocks","Budget includes only debts"],"a":0,"x":"Budget 看計劃，Cash Flow Statement 看實際 Cash inflow/outflow。","kind":"Knowledge"},{"id":"t9q26","q":"If actual monthly expenses exceed actual income, the person has a _____.","o":["Higher net worth automatically","Cash-flow deficit","Positive profit by default","Guaranteed surplus"],"a":1,"x":"Cash flow deficit 指 Cash outflow > Cash inflow。","kind":"Application"},{"id":"t9q27","q":"In financial decisions, what is the difference between Need and Want?","o":["Need is essential; Want is desirable but not always necessary","Want is always cheaper","Need always requires a bank loan","They mean exactly the same thing"],"a":0,"x":"需要（Need）與想要（Want）應分清，避免不必要支出。","kind":"Knowledge"},{"id":"t9q28","q":"What is Delaying Gratification?","o":["Postponing a non-essential purchase to support future goals","Always selecting the most expensive option","Ignoring financial goals","Buying immediately with borrowed money"],"a":0,"x":"延遲滿足（Delaying Gratification）可幫助達到長期 Financial goals。","kind":"Knowledge"},{"id":"t9q29","q":"Which is an early sign of financial trouble?","o":["Paying debts on time","Monitoring monthly expenses","Maintaining emergency savings","Regularly paying only the minimum on credit cards"],"a":3,"x":"只繳 Credit card minimum、Debt 不斷增加是 Financial trouble 訊號。","kind":"Knowledge"},{"id":"t9q30","q":"What should a borrower do when repayment problems begin?","o":["Borrow repeat
