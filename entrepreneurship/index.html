edly to hide the issue","Ignore payment reminders","Contact the lender and seek early financial counselling","Stop checking statements"],"a":2,"x":"課本建議及早聯絡 Bank 或尋求 AKPK 等財務輔導；不要逃避。","kind":"Knowledge"}]},"10":{"title":"財富、保險與債務管理","en":"Achieving Entrepreneur's Personal Financial Dreams","questions":[{"id":"t10q1","q":"Why does the textbook encourage a saving habit?","o":["To guarantee winning investments","To remove the need for budgeting","To avoid all life expenses","To build wealth and improve future financial security"],"a":3,"x":"儲蓄習慣（Saving Habit）幫助累積 Assets 與長期 Financial security。","kind":"Knowledge"},{"id":"t10q2","q":"What is an example of automatic saving?","o":["Borrowing for entertainment","Buying without checking a budget","Transferring a set amount to savings when salary arrives","Saving only the cash left after every purchase"],"a":2,"x":"自動儲蓄（Automatic Saving）可減少對意志力的依賴。","kind":"Knowledge"},{"id":"t10q3","q":"Before investing, what should a person identify?","o":["Goals, time horizon and acceptable risk","Only a friend's opinion","A guaranteed return certificate","Only the investment's advertising design"],"a":0,"x":"投資前要考慮 Goals、Time horizon、Risk tolerance 和 Expected return。","kind":"Knowledge"},{"id":"t10q4","q":"What is the general relationship between investment risk and return?","o":["Risk can always be eliminated","Higher potential return often involves greater risk","All investments have identical risk","Higher return always means no risk"],"a":1,"x":"一般 Risk–Return 原則：較高期望回報通常伴隨較高風險。","kind":"Knowledge"},{"id":"t10q5","q":"Why is Diversification useful?","o":["It spreads risk across different investments","It concentrates all money in one product","It guarantees no losses in every market","It removes the need for research"],"a":0,"x":"投資分散（Diversification）降低單一 Asset 失敗的集中影響。","kind":"Knowledge"},{"id":"t10q6","q":"Which investor is typically MOST willing to accept large value changes?","o":["A fixed-income saver only","Aggressive Investor","A person refusing all risk","Conservative Investor"],"a":1,"x":"Aggressive investor 通常能承受較大 Volatility；Conservative investor 較保守。","kind":"Knowledge"},{"id":"t10q7","q":"Which investment generally provides ownership in a company?","o":["Insurance premium","Credit-card debt","Shares / Equities","Car loan instalment"],"a":2,"x":"股票（Shares / Equities）代表公司的一部分 Ownership。","kind":"Knowledge"},{"id":"t10q8","q":"What is a Unit Trust Fund?","o":["A single household appliance","A type of unpaid personal debt","A guaranteed government salary","Money pooled from investors and managed in a fund"],"a":3,"x":"單位信託（Unit Trust Fund）把 Investors' money 集中，由 Fund manager 投資資產。","kind":"Knowledge"},{"id":"t10q9","q":"What is a possible drawback of investing in Property?","o":["No market risk","No ongoing ownership cost","Instant guaranteed resale","Low liquidity and a long investment horizon"],"a":3,"x":"房地產（Property）通常流動性較低（Low liquidity），且有長期資金需求。","kind":"Knowledge"},{"id":"t10q10","q":"What is a Bond in simple terms?","o":["An insurance claim document","Ownership of every company share","An automatic salary increase","A loan made to a government or company"],"a":3,"x":"債券（Bond）本質上是向 Government / Company 借出資金並按條件收取利息。","kind":"Knowledge"},{"id":"t10q11","q":"What does REIT stand for?","o":["Retail Equipment Interest Transfer","Real Estate Investment Trust","Regular Employee Income Tax","Registered Export Insurance Trade"],"a":1,"x":"REIT = Real Estate Investment Trust，主要投資 Real Estate / Property。","kind":"Knowledge"},{"id":"t10q12","q":"Which investment type is generally more liquid and low-return in the textbook's examples?","o":["Cash or Fixed Deposit","An undeveloped land plot","Private company shares with no market","A specialised factory building"],"a":0,"x":"Cash / Fixed interest investments 通常 Liquidity 較高、Return 較低，但仍可能有 Inflation risk。","kind":"Knowledge"},{"id":"t10q13","q":"What is the MAIN purpose of Insurance?","o":["Make health problems impossible","Replace all emergency planning","Provide financial protection against specified losses","Guarantee investment profits"],"a":2,"x":"保險（Insurance）透過保費（Premium）換取指定風險下的保障。","kind":"Knowledge"},{"id":"t10q14","q":"What is an Insurance Premium?","o":["A tax refund","A bank loan principal","Amount paid for an insurance policy","A guaranteed share dividend"],"a":2,"x":"保費（Premium）是投保人向 insurer 支付的保障成本。","kind":"Knowledge"},{"id":"t10q15","q":"Which insurance mainly provides coverage for a specific period?","o":["Whole Life Insurance only","Unit Trust Fund","Term Life Insurance","Motor Road Tax"],"a":2,"x":"定期壽險（Term Life）保障特定期限（Term）。","kind":"Knowledge"},{"id":"t10q16","q":"Which life insurance product combines protection with a savings element?","o":["A pure debit card","A fixed traffic fine","Endowment","A commercial invoice"],"a":2,"x":"儲蓄壽險（Endowment）結合 Protection 和 Savings。","kind":"Knowledge"},{"id":"t10q17","q":"Which policy mainly helps cover hospitalisation and treatment costs?","o":["Motor Third-party Only","Commercial Bond","Travel Baggage Only","Medical and Health Insurance"],"a":3,"x":"醫療健康保險（Medical and Health Insurance）主要涵蓋住院、醫療等。","kind":"Knowledge"},{"id":"t10q18","q":"Which type of insurance helps protect against damage or theft of a vehicle?","o":["Unit Trust","Motor Insurance","Term Life only","Personal Loan"],"a":1,"x":"汽車保險（Motor Insurance）保障指定 Motor risks，實際範圍依 Policy。","kind":"Knowledge"},{"id":"t10q19","q":"What is Takaful based on?","o":["Shariah principles and mutual assistance","No contribution from participants","A personal credit-card contract only","Guaranteed speculative trading"],"a":0,"x":"伊斯蘭保險（Takaful）以 Shariah principles 和 Mutual assistance 為基礎。","kind":"Knowledge"},{"id":"t10q20","q":"What is a common Takaful fund contribution used for?","o":["Guaranteeing high stock-market returns","Supporting participants facing specified losses","Eliminating all future risks","Buying the fund manager's personal car"],"a":1,"x":"Takaful participants 透過 contribution 加入共同基金，按 plan terms 協助受保障者。","kind":"Knowledge"},{"id":"t10q21","q":"Which is an example of General Takaful?","o":["Investment-linked Life only","Retirement Annuity only","Motor Takaful","Personal Savings Plan only"],"a":2,"x":"Motor Takaful 屬 General Takaful；Family Takaful 包括健康、退休等產品。","kind":"Knowledge"},{"id":"t10q22","q":"Before borrowing, what is the MOST important question?","o":["Can I afford the instalments and total borrowing cost?","Is my loan advertisement attractive?","Can I get the maximum amount offered?","Will I never face another emergency?"],"a":0,"x":"借款前應檢查 Loan purpose、Affordability、Total interest / fees 和 Cash flow。","kind":"Knowledge"},{"id":"t10q23","q":"Which is an example of a secured borrowing arrangement used to buy a car?","o":["Insurance Claim Only","Hire Purchase / Car Loan","Personal Savings Deposit","Unit Trust Dividend"],"a":1,"x":"汽車貸款（Car loan / Hire purchase）通常涉及貸款安排、deposit 和 vehicle ownership conditions。","kind":"Knowledge"},{"id":"t10q24","q":"For a housing loan, which comparison is important?","o":["Only the nearest restaurant","Only the logo of the lender","Only the property paint colour","Fixed versus variable interest rates and other fees"],"a":3,"x":"Housing loan 應比較 Fixed/Variable interest、Fees、Instalment、Tenure 和 penalties。","kind":"Knowledge"},{"id":"t10q25","q":"What is the key difference between a Credit Card and a Debit Card?","o":["Credit card only uses prepaid money","They are identical in repayment","Debit card always includes a loan","Credit card creates a bill; debit card deducts bank funds immediately"],"a":3,"x":"Credit card 先消費後還款；Debit card 即時由 Bank account 扣款。","kind":"Knowledge"},{"id":"t10q26","q":"Which card normally requires the full balance to be paid each month?","o":["Prepaid Card","Charge Card","Standard Credit Card only","Debit Card"],"a":1,"x":"簽帳卡（Charge Card）通常要求 Full payment each month，否則有 charges。","kind":"Knowledge"},{"id":"t10q27","q":"What is the spending limit on a Prepaid Card mainly based on?","o":["The supplier's credit rating","The amount loaded onto the card","The customer's annual leave","A guaranteed unlimited bank loan"],"a":1,"x":"預付卡（Prepaid Card）主要按已充值餘額使用。","kind":"Knowledge"},{"id":"t10q28","q":"Why is paying only the credit-card minimum dangerous?","o":["It guarantees debt disappears quickly","It removes every interest charge","It automatically increases savings","Compound interest can increase the total amount owed"],"a":3,"x":"只付 Minimum payment 會延長還款，Compound interest / Finance charges 增加總成本。","kind":"Knowledge"},{"id":"t10q29","q":"What does a Guarantor agree to do?","o":["Become the legal owner of every borrower asset","Cancel a loan without the lender","Potentially repay a loan if the borrower defaults","Receive a guaranteed reward from the borrower"],"a":2,"x":"擔保人（Guarantor）在借款人 Default 時可能依法負責 Unpaid amount。","kind":"Knowledge"},{"id":"t10q30","q":"Why should a borrower check a CCRIS report?","o":["To monitor credit and repayment history","To guarantee new loans","To see weather forecasts","To replace insurance coverage"],"a":0,"x":"CCRIS 是 Central Credit Reference Information System，可供檢視貸款與還款紀錄。","kind":"Knowledge"}]}}</script>
<script>
(()=>{
const DATA=JSON.parse(document.getElementById('questionData').textContent),letters='ABCD';
const stateKey='mpu3223-mcq-300-v1';
let state={theme:'light',practice:{},attempted:{},mistakes:{},bookmarks:{},mocks:{},best:{},lastTopic:1};
try{const stored=JSON.parse(localStorage.getItem(stateKey)||'{}'); state={...state,...stored};}catch(e){}
const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(state));}catch(e){}};
let view='home',currentTopic=Number(state.lastTopic)||1,mode='practice',filter='all',cursor=0,reviewPicks={};
const main=document.getElementById('main'),nav=document.getElementById('chapterNav');
const countPracticed=t=>DATA[t].questions.filter(q=>state.practice[q.id]||state.attempted?.[q.id]).length;
const countMistakes=t=>DATA[t].questions.filter(q=>state.mistakes[q.id]).length;
const countSaved=t=>DATA[t].questions.filter(q=>state.bookmarks[q.id]).length;
const allStats=()=>{const practiced=new Set([...Object.keys(state.practice),...Object.keys(state.attempted||{})]).size,wrong=Object.values(state.mistakes).filter(Boolean).length,saved=Object.values(state.bookmarks).filter(Boolean).length;return {practiced,wrong,saved}};
function safe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function scrollToTop(){main.scrollIntoView({behavior:'smooth',block:'start'});}
function navRender(){const temp=['<p class="side-label">CHAPTERS · 各 30 題</p>'];for(let t=1;t<=10;t++){const d=DATA[t];temp.push(`<button class="topic-btn ${view!=='home'&&t===currentTopic?'active':''}" data-topic="${t}" type="button"><span class="topic-no">${t}</span><span class="topic-body"><strong>${safe(d.title)}</strong><small>${countPracticed(t)}/30 已練 · 錯題 ${countMistakes(t)}</small></span></button>`);}nav.innerHTML=temp.join('');nav.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>startTopic(Number(b.dataset.topic))));}
function hero(title,desc){return `<section class="hero"><div class="eyebrow">MPU3223_V2 · EXAM PRACTICE</div><h1>${title}</h1><p class="muted">${desc}</p></section>`;}
function statsHTML(){const s=allStats();return `<div class="stats"><div class="stat"><b>${s.practiced}<small class="muted"> / 300</small></b><span>已練習題數</span></div><div class="stat"><b>${s.wrong}</b><span>待重練錯題</span></div><div class="stat"><b>${s.saved}</b><span>收藏題目</span></div></div>`;}
function renderHome(){view='home';navRender();const s=allStats();main.innerHTML=`${hero('300 題 MCQ 考前刷題','10 個 Topic × 每章 30 題。英文題目、繁體中文解析；適合先練習，再做整章模擬考。')}${statsHTML()}<section class="panel"><h2 class="section-title">選擇 Topic 開始</h2><div class="chapter-grid">${Object.entries(DATA).map(([t,d])=>`<button class="chapter-card" data-chapter="${t}" type="button"><b>TOPIC ${t} · ${countPracticed(t)}/30 已練</b><span>${safe(d.title)}</span><small>${safe(d.en)}</small></button>`).join('')}</div><div class="learning-note"><b>建議刷題順序：</b>先用「逐題練習」看中文解析 → 答錯加入錯題集 → 最後用「30 題模擬考」檢查是否真的記住。</div><label for="qsearch"><b>搜尋題目或英文術語</b></label><input class="search" id="qsearch" placeholder="例如 Innovation、Risk、Business Plan…" type="search" autocomplete="off"><div id="searchResults" class="searchresults"></div></section><div class="notice">跨裝置開啟相同檔案可以閱讀同一題庫，但進度與錯題是分別儲存在每一台裝置的瀏覽器，並不會自動同步。</div>`;main.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>startTopic(Number(b.dataset.chapter))));main.querySelector('#qsearch').addEventListener('input',onSearch);}
function onSearch(e){const v=e.target.value.trim().toLowerCase();const box=document.getElementById('searchResults');if(v.length<2){box.innerHTML='';return;}const hits=[];for(let t=1;t<=10;t++)for(let i=0;i<30;i++){const q=DATA[t].questions[i];if((q.q+' '+q.x+' '+q.o.join(' ')).toLowerCase().includes(v)){hits.push([t,i,q]);if(hits.length>=14)break;}if(hits.length>=14)break;}box.innerHTML=hits.length?hits.map(([t,i,q])=>`<button class="searchhit" data-find="${t}-${i}" type="button"><strong>Topic ${t} · 第 ${i+1} 題</strong><span>${safe(q.q)}</span></button>`).join(''):'<p class="muted">沒有搜尋結果，換個關鍵字試試看。</p>';box.querySelectorAll('[data-find]').forEach(b=>b.addEventListener('click',()=>{const[t,i]=b.dataset.find.split('-').map(Number);startTopic(t,'practice','all',i);}));}
function startTopic(t,m='practice',f='all',i=null){currentTopic=t;mode=m;filter=f;cursor=i??0;reviewPicks={};state.lastTopic=t;save();view='play';navRender();renderPlay();scrollToTop();}
function getQueue(){let q=DATA[currentTopic].questions; if(filter==='wrong')q=q.filter(x=>state.mistakes[x.id]);if(filter==='saved')q=q.filter(x=>state.bookmarks[x.id]);return q;}
function mockRecord(){const t=currentTopic;if(!state.mocks[t])state.mocks[t]={picks:{},submitted:false,score:null};return state.mocks[t];}
function answeredCount(){if(mode==='mock')return Object.keys(mockRecord().picks).length;return DATA[currentTopic].questions.filter(q=>state.practice[q.id]).length;}
function modeButtons(){return `<div class="tabgroup" aria-label="練習模式"><button class="tab ${mode==='practice'&&filter==='all'?'active':''}" data-mode="practice" data-filter="all" type="button">逐題練習</button><button class="tab ${mode==='mock'?'active':''}" data-mode="mock" data-filter="all" type="button">30 題模擬考</button><button class="tab ${mode==='practice'&&filter==='wrong'?'active':''}" data-mode="practice" data-filter="wrong" type="button">錯題重練 (${countMistakes(currentTopic)})</button><button class="tab ${mode==='practice'&&filter==='saved'?'active':''}" data-mode="practice" data-filter="saved" type="button">收藏題 (${countSaved(currentTopic)})</button></div>`;}
function selectControls(){main.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.mode, f=b.dataset.filter;if(m==='mock'&&state.mocks[currentTopic]?.submitted){mode='mock';filter='all';view='results';renderResults();return;}mode=m;filter=f;cursor=0;reviewPicks={};view='play';renderPlay();}));}
function progressIndex(queue){const q=queue[cursor];return q ? cursor+1 : 0;}
function getStoredChoice(q){if(mode==='mock')return mockRecord().picks[q.id];if(filter==='wrong')return reviewPicks[q.id];return state.practice[q.id]?.selected;}
function getFeedback(q){if(mode==='mock')return null;if(filter==='wrong'){return Object.prototype.hasOwnProperty.call(reviewPicks,q.id)?reviewPicks[q.id]:null;}return state.practice[q.id] ? state.practice[q.id].selected:null;}
function renderPlay(){view='play';navRender();const d=DATA[currentTopic],queue=getQueue(),total=queue.length;
  let h=hero(`Topic ${currentTopic}｜${safe(d.title)}`,` ${safe(d.en)} · 30 題選擇題`)+`<section class="panel">${modeButtons()}<div class="study-strip"><span class="muted">${mode==='mock'?'模擬考：選擇後先不公布答案，交卷才計分。':'練習：選擇答案後立即顯示正確答案和中文解析。'}</span><b>${mode==='mock'?answeredCount()+'/30 已作答':countPracticed(currentTopic)+'/30 已練習'}</b></div><div class="progress-track"><div class="progress-fill" style="width:${(mode==='mock'?answeredCount():countPracticed(currentTopic))/30*100}%"></div></div></section>`;
 if(total===0){h+=`<section class="panel empty"><h3>${filter==='wrong'?'這一章目前沒有錯題':'這一章目前沒有收藏題'}</h3><p>可以回到「逐題練習」，或直接挑戰模擬考。</p><button class="btn primary" data-goall type="button">開始逐題練習</button></section>`;main.innerHTML=h;selectControls();main.querySelector('[data-goall]').addEventListener('click',()=>{mode='practice';filter='all';cursor=0;renderPlay()});return;}
 cursor=Math.max(0,Math.min(cursor,total-1));const q=queue[cursor],chosen=getStoredChoice(q),answered=getFeedback(q)!==null;
 const heading=`<div class="q-meta"><span class="q-kicker">${mode==='mock'?'模擬考':'練習'} · 第 ${cursor+1} / ${total} 題</span><button class="btn small" id="bookmarkBtn" type="button">${state.bookmarks[q.id]?'★ 取消收藏':'☆ 收藏這題'}</button></div><h2 class="q-stem">${safe(q.q)}</h2>`;
 const opts=q.o.map((o,j)=>{const cls=[`choice`];if(chosen===j)cls.push('selected');if(answered&&mode!=='mock'){if(j===q.a)cls.push('good');if(j===chosen&&chosen!==q.a)cls.push('bad');}return `<button class="${cls.join(' ')}" data-pick="${j}" type="button" ${answered?'disabled':''}><span class="letter">${letters[j]}</span><span>${safe(o)}</span></button>`}).join('');
 const feedback=answered&&mode!=='mock'?`<div class="feedback" role="status"><p class="${chosen===q.a?'correct':'wrong'}">${chosen===q.a?'✓ 答對了！':'✗ 這題答錯了。'}</p><p><b>正確答案：${letters[q.a]}. ${safe(q.o[q.a])}</b></p><p>${safe(q.x)}</p></div>`:'';
 const navbtns=`<div class="bottomrow"><div class="arrows"><button class="btn" id="previous" type="button" ${cursor===0?'disabled':''}>← 上一題</button><button class="btn primary" id="next" type="button">${cursor===total-1?'完成本輪':'下一題 →'}</button></div>${mode==='mock'?`<button class="btn" id="submitMock" type="button">交卷 · 查看分數</button>`:`<span class="muted" style="font-size:13px">${filter==='all'?'已做過的題可回看解析':'這個模式會更新錯題狀態'}</span>`}</div>`;
 const indices=`<div class="q-index" aria-label="題目編號">${queue.map((v,i)=>{const rec=mode==='mock'?(mockRecord().picks[v.id]!==undefined?{correct:null}:null):(filter==='wrong'?(reviewPicks[v.id]!==undefined?{correct:reviewPicks[v.id]===v.a}:null):state.practice[v.id]);const klass=['index-button'];if(i===cursor)klass.push('current');if(rec)klass.push('answered');if(rec&&rec.correct===true)klass.push('right');if(rec&&rec.correct===false)klass.push('wrong');return `<button class="${klass.join(' ')}" data-goto="${i}" type="button" aria-label="跳到第 ${i+1} 題">${i+1}</button>`}).join('')}</div>`;
 main.innerHTML=h+`<section class="question-card">${heading}<div class="choices">${opts}</div>${feedback}${navbtns}${indices}</section><div class="notice">練習題為依教材編寫的非官方模擬題，英文題幹與選項由本題庫編寫；解釋使用繁體中文及相關英文術語。</div>`;
 selectControls();main.querySelector('#bookmarkBtn').addEventListener('click',()=>{state.bookmarks[q.id]=!state.bookmarks[q.id];save();renderPlay()});
 main.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const sel=Number(b.dataset.pick);if(mode==='mock'){mockRecord().picks[q.id]=sel;save();renderPlay();return;}if(filter==='wrong'){reviewPicks[q.id]=sel;}else{state.practice[q.id]={selected:sel,correct:sel===q.a};}if(sel===q.a)delete state.mistakes[q.id];else state.mistakes[q.id]=true;save();renderPlay();}));
 main.querySelector('#previous').addEventListener('click',()=>{cursor=Math.max(0,cursor-1);renderPlay();});
 main.querySelector('#next').addEventListener('click',()=>{if(cursor===total-1){if(mode==='mock'){finishMock();}else showPracticeFinish();}else{cursor++;renderPlay();}});
 if(mode==='mock')main.querySelector('#submitMock').addEventListener('click',finishMock);
 main.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{cursor=Number(b.dataset.goto);renderPlay();}));
}
function showPracticeFinish(){const c=countPracticed(currentTopic),w=countMistakes(currentTopic);main.innerHTML=hero(`Topic ${currentTopic}｜練習完成`, '這一輪已經看到最後一題，可以繼續補做未練習題或重刷錯題。')+`<section class="panel"><h2 class="section-title">${c} / 30 題已練習</h2><p>本 Topic 待重練錯題：<b>${w}</b> 題。</p><div class="tabgroup"><button class="btn primary" data-again="all">回到逐題練習</button><button class="btn" data-again="wrong">重刷錯題 (${w})</button><button class="btn" data-again="mock">挑戰模擬考</button></div></section>`;main.querySelectorAll('[data-again]').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.again;startTopic(currentTopic,f==='mock'?'mock':'practice',f==='mock'?'all':f)}));}
function finishMock(){const m=mockRecord(),questions=DATA[currentTopic].questions,unanswered=questions.filter(q=>m.picks[q.id]===undefined).length;if(unanswered && !confirm(`還有 ${unanswered} 題沒作答。確定要交卷嗎？`))return;let score=0;for(const q of questions){const sel=m.picks[q.id];if(sel!==undefined)state.attempted[q.id]=true;if(sel===q.a){score++;delete state.mistakes[q.id]}else state.mistakes[q.id]=true;}m.submitted=true;m.score=score;state.best[currentTopic]=Math.max(Number(state.best[currentTopic])||0,score);save();view='results';renderResults();scrollToTop();}
function renderResults(){view='results';navRender();const questions=DATA[currentTopic].questions,m=mockRecord();if(!m.submitted){mode='mock';renderPlay();return;}const pct=Math.round(m.score/30*100);let msg=pct>=80?'概念掌握得不錯，可以集中重練錯題。':pct>=60?'已經有基礎，建議針對錯題對應的 Topic 內容補強。':'建議先回到教材概念，理解後再做第二輪。';
 let h=hero(`Topic ${currentTopic}｜模擬考成績`,'30 題作答結果及中文解析')+`<section class="panel"><span class="eyebrow">本次得分</span><div class="summary-score">${m.score}<small class="muted"> / 30</small></div><p><b>${pct}%</b> · ${msg}</p><div class="tabgroup"><button class="btn primary" id="redoMock">重新模擬 30 題</button><button class="btn" id="reviewWrong">重練錯題 (${countMistakes(currentTopic)})</button><button class="btn" id="backPractice">逐題練習</button></div><h2 class="section-title">逐題答案與解析</h2>${questions.map((q,i)=>{const sel=m.picks[q.id],correct=sel===q.a;return `<div class="result-item"><span class="${correct?'status-ok':'status-bad'}">${correct?'✓ 正確':'✗ 錯誤或未作答'} · ${i+1}/30</span><b>${safe(q.q)}</b><p>你的答案：${sel===undefined?'未作答':letters[sel]+'. '+safe(q.o[sel])}</p><p><b>正確答案：${letters[q.a]}. ${safe(q.o[q.a])}</b></p><p class="muted">${safe(q.x)}</p><button class="btn small" data-save="${q.id}" type="button">${state.bookmarks[q.id]?'★ 已收藏':'☆ 收藏'}</button></div>`}).join('')}</section>`;
 main.innerHTML=h;main.querySelector('#redoMock').addEventListener('click',()=>{state.mocks[currentTopic]={picks:{},submitted:false,score:null};save();mode='mock';cursor=0;renderPlay();scrollToTop()});main.querySelector('#reviewWrong').addEventListener('click',()=>startTopic(currentTopic,'practice','wrong'));main.querySelector('#backPractice').addEventListener('click',()=>startTopic(currentTopic));main.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{state.bookmarks[b.dataset.save]=!state.bookmarks[b.dataset.save];save();renderResults();}));}
const themeButton=document.getElementById('themeToggle');function setTheme(){if(state.theme==='dark'){document.documentElement.dataset.theme='dark';themeButton.textContent='淺色模式';}else{delete document.documentElement.dataset.theme;themeButton.textContent='深色模式';}}themeButton.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();setTheme();});document.getElementById('homeButton').addEventListener('click',()=>{renderHome();scrollToTop();});setTheme();renderHome();
})();
</script>
</body>
</html>
